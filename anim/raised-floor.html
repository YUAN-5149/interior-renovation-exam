<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高架木地板施工順序｜3D 工法動畫</title>
<meta name="description" content="室裝乙級術科：高架木地板 10 步驟施工順序 3D 互動動畫，可逐步播放、旋轉視角、看剖面。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111801';

const STEPS = [
  {t:'施工前', d:'一間準備做高架木地板的房間。按「播放」或「下一步」開始。',
   tip:'高架木地板是用角材把地板架高，底下可走管線、隔絕濕氣。術科常考施工順序：先骨架、再底板、最後面材與收邊。'},
  {t:'確認管線位置', d:'在地坪上確認既有水電管線與出線口的位置，並做好記號。',
   tip:'後面固定筋要釘進地坪，先確認管線位置，才不會打穿水管或電管。'},
  {t:'定水平基準線', d:'用雷射水平儀在四周牆面放出水平基準線。',
   tip:'基準線由完成面高度往下扣除面板、夾板厚度而來；之後所有角材都以這條線為準。'},
  {t:'釘壁面四周角材', d:'沿著基準線，把角材固定在牆面四周。',
   tip:'四周角材是之後主支架兩端的支撐點。'},
  {t:'鋪設 PE 防潮布', d:'在地坪鋪上 PE 防潮布，接縫要重疊，四周往牆面反折。',
   tip:'阻隔地坪濕氣，避免角材與木地板受潮變形、發霉。'},
  {t:'釘中間橫向角材（主支架）', d:'橫向角材兩端架在四周角材上，依間距排好，這就是主支架。',
   tip:'主支架先定位排好，下一步才用固定筋把它撐住、調水平。'},
  {t:'釘固定筋', d:'在主支架旁釘固定筋，往下撐到地坪固定，同時把角材面調到水平。',
   tip:'固定筋往下撐在地坪，方向和天花板的吊筋（往上吊在樓板）相反。'},
  {t:'釘中間縱向角材（副支架）', d:'在主支架之間補上縱向角材，形成格狀骨架。',
   tip:'格狀骨架讓上面的夾板四邊都有角材可以下釘。'},
  {t:'釘 12 mm 夾板', d:'在角材骨架上鋪 12 mm 夾板並釘牢，板與板的接縫錯開。',
   tip:'夾板是底板，讓面板受力均勻、踩起來不會軟。'},
  {t:'釘面板', d:'在夾板上鋪木地板面板，面板以 45 度角斜釘入角材。',
   tip:'面板以 45 度角釘入角材；溢出的膠要馬上擦掉，乾了很難處理。'},
  {t:'牆面收邊', d:'沿牆面裝上踢腳板收邊，完成高架木地板。',
   tip:'地板與牆面之間通常留伸縮縫，再用踢腳板蓋住，兼具收邊與美觀。'},
];

createAnim({
  title: '高架木地板施工順序',
  steps: STEPS,
  views: {
    def:{dir:[0.62,0.55,0.70], dist:8.2, target:[0,0.15,0]},
    6:  {dir:[0.55,0.42,0.78], dist:5.0, target:[0.3,0.12,0.1]},
    7:  {dir:[0.55,0.62,0.62], dist:6.6, target:[0,0.2,0]},
  },
  cut: {
    plank:[new THREE.Plane(new THREE.Vector3(-1,0,0), 0.55)],
    ply:  [new THREE.Plane(new THREE.Vector3(-1,0,0), 1.15)],
  },
  cutLabel: '切開面板與夾板，看裡面的骨架',
  build({mat, box, span, pipe, group, arrow, add, fixed}) {
    /* 尺寸（公尺，構造厚度刻意放大） */
    const X0=-1.9, X1=1.9, Z0=-1.4, Z1=1.4;
    const S=0.06, H=0.30, PLY=0.03, FIN=0.025, FF=H+PLY+FIN;

    const M = {
      wall:  mat('#f5f4f1',{roughness:.95}),
      slab:  mat('#d3cec8',{roughness:1}),
      wood:  mat('#dcb97f'),
      leg:   mat('#c99e5f'),
      ply:   mat('#ead39f',{roughness:.9}),
      pe:    mat('#dbeafe',{roughness:.4, transparent:true, opacity:.6, side:2, depthWrite:false}),
      water: mat('#3b82f6',{roughness:.5}),
      elec:  mat('#f97316',{roughness:.5}),
      box:   mat('#1d4ed8',{roughness:.6}),
      laser: mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.8}),
      dev:   mat('#facc15',{roughness:.5}),
      dark:  mat('#44403c',{roughness:.6}),
      arrow: mat('#ea580c',{emissive:'#ea580c', emissiveIntensity:.35}),
      skirt: mat('#6b3f22',{roughness:.7}),
      ghost: mat('#ffffff',{transparent:true, opacity:.18, depthWrite:false, roughness:1}),
      planks:['#a5653b','#94572f','#b3744a','#9c5e35'].map(c=>mat(c,{roughness:.55})),
    };

    // 樓板、牆（前、右牆半透明，方便看地板各層）
    fixed(span(-2,-0.2,-1.5, 2,0,1.5, M.slab));
    fixed(span(-2,0,-1.5, 2,1.6,Z0, M.wall));
    fixed(span(-2,0,Z0, X0,1.6,1.5, M.wall));
    for (const w of [span(X0,0,Z1, 2,0.6,1.5, M.ghost,{shadow:false}), span(X1,0,Z0, 2,0.6,Z1, M.ghost,{shadow:false})]) {
      w.receiveShadow=false; w.renderOrder=2; w.children[0].material.opacity=.5; fixed(w);
    }

    /* ① 管線 */
    let d=0;
    add(1, pipe([-1.2,0.01,Z0+0.05],[-1.2,0.01,1.1],0.03,M.water),{delay:d,drop:.3});
    add(1, pipe([-1.2,0.01,1.1],[0.4,0.01,1.1],0.03,M.water),{delay:d+=.15,drop:.3});
    add(1, pipe([X0+0.05,0.01,-0.6],[1.3,0.01,-0.6],0.025,M.elec),{delay:d+=.15,drop:.3});
    add(1, pipe([1.3,0.01,-0.6],[1.3,0.01,Z0+0.04],0.025,M.elec),{delay:d+=.1,drop:.3});
    add(1, pipe([1.3,0.01,Z0+0.04],[1.3,0.5,Z0+0.04],0.025,M.elec),{delay:d+=.1,drop:.3,until:8});
    [-0.9, 0.3, 1.3].forEach((x,i)=> add(1, span(x-0.06,0.5,Z0,x+0.06,0.62,Z0+0.03,M.box),{delay:.6+i*.12,drop:.2}));
    add(1, span(X0,0.5,0.5,X0+0.03,0.62,0.62,M.box),{delay:.95,drop:.2});

    /* ② 水平基準線 */
    const t=0.012, h=0.008, LO={edges:false,shadow:false}, LA={drop:0,until:8,glow:false};
    add(2, span(X0,FF-h,Z0,X1,FF+h,Z0+t,M.laser,LO),{...LA,delay:.35});
    add(2, span(X0,FF-h,Z0,X0+t,FF+h,Z1,M.laser,LO),{...LA,delay:.45});
    add(2, span(X0,FF-h,Z1-t,X1,FF+h,Z1,M.laser,LO),{...LA,delay:.55});
    add(2, span(X1-t,FF-h,Z0,X1,FF+h,Z1,M.laser,LO),{...LA,delay:.65});
    const head = box(.16,.12,.16,M.dev); head.position.y = FF;
    const lens = box(.06,.05,.17,M.dark,{edges:false}); lens.position.y = FF;
    const dev = group(head, lens);
    for (let a=0;a<3;a++){ const ang=a*Math.PI*2/3; dev.add(pipe([0,FF-0.06,0],[Math.cos(ang)*.18,0,Math.sin(ang)*.18],.012,M.dark)); }
    dev.position.set(0.2,0,0.2);
    add(2, dev, {delay:0, drop:.5, until:3});

    /* ③ 四周角材 */
    add(3, span(X0,H-S,Z0,X1,H,Z0+S,M.wood),{delay:0});
    add(3, span(X0,H-S,Z0+S,X0+S,H,Z1-S,M.wood),{delay:.15});
    add(3, span(X0,H-S,Z1-S,X1,H,Z1,M.wood),{delay:.3});
    add(3, span(X1-S,H-S,Z0+S,X1,H,Z1-S,M.wood),{delay:.45});

    /* ④ PE 防潮布 */
    { const y=0.035, up=0.14, o={edges:false,shadow:false};
      add(4, group(
        span(X0,y,Z0,X1,y+.004,Z1,M.pe,o),
        span(X0,y,Z0,X1,y+up,Z0+.004,M.pe,o), span(X0,y,Z0,X0+.004,y+up,Z1,M.pe,o),
        span(X0,y,Z1-.004,X1,y+up,Z1,M.pe,o), span(X1-.004,y,Z0,X1,y+up,Z1,M.pe,o)
      ), {delay:0, drop:.6});
      add(4, span(-0.1,y+.005,Z0,0.1,y+.007,Z1,mat('#93c5fd',{transparent:true,opacity:.7}),o),{delay:.35,drop:.3}); }

    /* ⑤ 主支架（橫向） */
    const JZ = [-0.9,-0.3,0.3,0.9];
    JZ.forEach((z,i)=> add(5, span(X0+S,H-S,z-S/2,X1-S,H,z+S/2,M.wood),{delay:i*.18, drop:.6}));

    /* ⑥ 固定筋＋向下箭頭 */
    const LX = [-1.75,-1.25,-0.75,-0.25,0.25,0.75,1.25,1.75];
    JZ.forEach((z,i)=> LX.forEach((x,j)=>
      add(6, span(x-S/2,0,z+S/2,x+S/2,H,z+S*1.5,M.leg),{delay:i*.15+j*.04, drop:.35})));
    [-1.25,-0.25,0.75].forEach((x,i)=>
      add(6, arrow([x,H+.42,-0.3+S],[x,H+.08,-0.3+S],M.arrow),{delay:.9+i*.1,drop:.25,until:6,glow:false}));

    /* ⑦ 副支架（縱向） */
    { const SX=[-1.5,-1.0,-0.5,0,0.5,1.0,1.5]; let k=0;
      for(let r=0;r<=JZ.length;r++){
        const za = r===0 ? Z0+S : JZ[r-1]+S/2+S;   // 讓開固定筋
        const zb = r===JZ.length ? Z1-S : JZ[r]-S/2;
        SX.forEach(x=> add(7, span(x-S/2,H-S,za,x+S/2,H,zb,M.wood),{delay:(k++)*.025, drop:.4}));
      } }

    /* ⑧ 12mm 夾板 */
    { const W=1.22, D=0.92, gap=.008; let k=0;
      for(let row=0, z=Z0; z<Z1-1e-3; row++, z+=D){
        const za=z, zb=Math.min(z+D,Z1);
        for(let x=X0-(row%2?W/2:0); x<X1-1e-3; x+=W){
          const xa=Math.max(x,X0), xb=Math.min(x+W,X1);
          if(xb-xa<.05) continue;
          add(8, span(xa+gap/2,H,za+gap/2,xb-gap/2,H+PLY,zb-gap/2,M.ply),{delay:(k++)*.09, drop:.5, cat:'ply'});
        }
      } }

    /* ⑨ 面板 */
    { const PW=0.14, PL=1.2, gap=.004; let r=0;
      for(let z=Z0; z<Z1-1e-3; z+=PW, r++){
        const za=z, zb=Math.min(z+PW,Z1), off=((r*0.47)%PL);
        let c=0;
        for(let x=X0-off; x<X1-1e-3; x+=PL, c++){
          const xa=Math.max(x,X0), xb=Math.min(x+PL,X1);
          if(xb-xa<.04) continue;
          add(9, span(xa+gap/2,H+PLY,za+gap/2,xb-gap/2,FF,zb-gap/2,M.planks[(r*3+c)%4]),{delay:r*.07+c*.03, drop:.3, cat:'plank'});
        }
      } }

    /* ⑩ 踢腳板收邊 */
    { const t=.018, h=.085;
      add(10, span(X0,FF,Z0,X1,FF+h,Z0+t,M.skirt),{delay:0,drop:.25});
      add(10, span(X0,FF,Z0+t,X0+t,FF+h,Z1,M.skirt),{delay:.2,drop:.25});
      add(10, span(X0+t,FF,Z1-t,X1,FF+h,Z1,M.skirt),{delay:.4,drop:.25});
      add(10, span(X1-t,FF,Z0+t,X1,FF+h,Z1-t,M.skirt),{delay:.6,drop:.25}); }
  },
});
</script>
</body>
