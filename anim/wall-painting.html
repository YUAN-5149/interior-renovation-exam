<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牆面油漆塗裝施工順序｜3D 工法動畫</title>
<meta name="description" content="室裝乙級：牆面油漆塗裝 8 步驟施工順序（補土 → 砂磨 → 底漆 → 面漆）3D 互動動畫。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'施工前', d:'粉光完成的牆面，有裂縫、孔洞、凹痕，要上水泥漆。',
   tip:'107 年學科：「壁面塗裝施工，下列何者程序為先？刷底漆／補土／砂磨／刷面漆」答案是「補土」。順序口訣：補土 → 砂磨 → 底漆 → 面漆。'},
  {t:'底材清潔・遮蔽', d:'清除灰塵、油污；地面、插座、門窗框遮蔽保護。', tip:'先遮蔽再施工，後面每一道都不用擔心沾到。'},
  {t:'補土（批土）', d:'以補土填平裂縫、孔洞、凹痕。', tip:'這是第一道實際塗裝工序（學科答案）。'},
  {t:'砂磨', d:'補土乾燥後以砂紙研磨平順，清除粉塵。', tip:'不研磨，補土的刮痕會透到面漆上。'},
  {t:'刷底漆（封底）', d:'全面塗刷一道底漆（抗鹼封底）。', tip:'底漆讓面漆附著均勻、防止水泥鹼性造成變色。'},
  {t:'二次補土・研磨', d:'底漆乾後若還有小瑕疵，再補土、研磨。', tip:'底漆一上，原本看不出的小凹痕會變明顯。'},
  {t:'面漆第一道', d:'塗刷第一道面漆，薄塗均勻。', tip:'薄塗多次優於一次厚塗。'},
  {t:'面漆第二道', d:'待第一道乾燥後，塗刷第二道面漆。', tip:'遵守重塗間隔時間。'},
  {t:'檢查・撕遮蔽', d:'檢查流掛、刷痕、針孔、色差，撕除遮蔽並清潔。', tip:'遮蔽膠帶在漆面未完全乾時撕，邊緣較整齊。'},
];

createAnim({
  title: '牆面油漆塗裝施工順序',
  steps: STEPS,
  groundY: -0.15,
  sun: [3, 7, 7],
  views: {
    def:{dir:[0.38,0.22,0.9], dist:5.0, target:[0,1.1,0.2]},
    2:  {dir:[0.3,0.12,0.95], dist:4.2, target:[0,1.5,0]},
  },
  cut: { coat:[new THREE.Plane(new THREE.Vector3(-1,0,0), -0.3)] },
  cutLabel: '切開面漆，看底漆與補土',
  note: '塗層厚度有誇大。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed}) {
    const X0=-1.8, X1=1.8, H=2.5;
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#c9c4bb',{roughness:.9}), crack: mat('#44403c'), hole: mat('#57534e'),
      tape: mat('#3b82f6',{roughness:.6}), sheet: mat('#e0f2fe',{transparent:true, opacity:.6, depthWrite:false}), plate: mat('#fafaf9'),
      putty: mat('#f8fafc',{roughness:1}), sand: mat('#ca8a04'), dust: mat('#e7e5e4'), primer: mat('#ece9e2',{roughness:.8}),
      c1: mat('#cfe3dc',{roughness:.6}), c2: mat('#b9d8cc',{roughness:.5}), roller: mat('#f1f5f9'), handle: mat('#7c2d12'), tray: mat('#64748b'),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-2.2,-0.15,-0.3,2.2,0,1.6,M.slab));
    fixed(span(-2.2,0,-0.2,2.2,2.7,0,M.wall));
    fixed(span(1.2,1.1,0,1.32,1.28,.008,M.plate));
    const CR=[[-1.0,1.9,-0.85,1.6],[-0.85,1.6,-0.95,1.35],[0.6,0.8,0.75,0.55]], HO=[[0.2,1.7],[-0.4,0.6],[1.4,1.9]];
    CR.forEach(([a,b,c,d])=>{ const L=Math.hypot(c-a,d-b), m=box(L,.008,.002,M.crack,NE); m.position.set((a+c)/2,(b+d)/2,.001); m.rotation.z=Math.atan2(d-b,c-a); fixed(m); });
    HO.forEach(([x,y])=> fixed(span(x-.03,y-.03,-.001,x+.03,y+.03,.0008,M.hole,NE)));

    add(1, group(span(-2.2,0.002,0.02,2.2,0.006,1.5,M.sheet,NE), span(-2.2,0,.0015,2.2,.04,.004,M.tape,NE), span(1.18,1.08,.008,1.34,1.3,.011,M.tape,NE)),{drop:0, until:8});
    { const g=group(); CR.forEach(([a,b,c,d])=>{ const L=Math.hypot(c-a,d-b), m=box(L+.04,.06,.003,M.putty,NE); m.position.set((a+c)/2,(b+d)/2,.0015); m.rotation.z=Math.atan2(d-b,c-a); g.add(m); });
      HO.forEach(([x,y])=> g.add(span(x-.06,y-.06,0,x+.06,y+.06,.003,M.putty,NE))); add(2, g, {drop:0}); }
    add(2, label('第一道：補土',0,2.55,0.2,1.0),{until:2, drop:0, glow:false});
    add(3, span(-0.95,1.55,.004,-0.8,1.63,.04,M.sand),{until:3, drop:-.2});
    for (let i=0;i<14;i++){ const d=new THREE.Mesh(new THREE.SphereGeometry(.008,6,6), M.dust.clone()); d.position.set(-0.95+((i*0.07)%0.2),1.3+((i*0.13)%0.25),.03+((i*0.11)%0.05)); add(3, d, {delay:.2+i*.03, drop:.1, until:3, glow:false}); }
    add(4, span(X0,0.04,.0035,X1,H,.0045,M.primer,NE),{drop:0});
    add(4, label('底漆（抗鹼封底）',0,2.65,0.2,1.2),{until:4, drop:0, glow:false});
    add(5, span(0.95,1.95,.0045,1.05,2.05,.0055,M.putty,NE),{drop:0});
    add(5, label('小瑕疵再補土・研磨',1.0,2.3,0.2,1.3),{until:5, drop:0, glow:false});
    for (let i=0;i<4;i++) add(6, span(X0+i*0.9,0.04,.0055,X0+(i+1)*0.9,H,.0062,M.c1,NE),{delay:i*.25, drop:0, cat:'coat'});
    add(6, group(pipe([0.3,1.0,.05],[0.55,1.0,.05],.04,M.roller), span(0.42,0.4,.05,0.44,1.0,.07,M.handle)),{until:7, drop:-.2});
    for (let i=0;i<4;i++) add(7, span(X0+i*0.9,0.04,.0062,X0+(i+1)*0.9,H,.007,M.c2,NE),{delay:i*.25, drop:0, cat:'coat'});
    add(8, label('檢查流掛・刷痕・針孔・色差',0,2.65,0.2,1.8),{until:8, drop:0, glow:false});
    fixed(span(0.6,0.006,0.6,1.0,0.06,0.9,M.tray));
  },
});
</script>
</body>
</html>
