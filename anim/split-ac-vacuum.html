<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分離式冷暖氣機抽真空的程序｜3D 工法動畫</title>
<meta name="description" content="室裝乙級（課本 6-4-13）：分離式冷暖氣機抽真空 5 步驟 3D 互動動畫：活動板手鬆開高低壓閥、紅管接高壓・黑管接低壓・黃管接真空泵、開閥開泵、抽到真空再抽約 10 分鐘、關閥停泵等 10 分鐘量表不下降。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'為什麼要抽真空', d:'室外機與室內機裝妥、冷媒管接好後，要作冷媒抽真空。',
   tip:'依課本 6-4-13：不作或不確實，冷媒內存有空氣，壓縮機運轉時冷媒不穩定，冷房效果時冷時熱，甚至影響銅管使用年限。'},
  {t:'鬆開高低壓閥', d:'使用活動板手鬆開冷氣室外機的高低壓閥。', tip:'高壓閥在較細的液管、低壓閥在較粗的氣管。'},
  {t:'接上量表與真空泵', d:'冷氣高低壓量表：紅色管線接在高壓閥口，黑色管線接低壓閥口，黃色管接真空泵。', tip:'口訣：紅高、黑低、黃接泵。'},
  {t:'開閥・開泵', d:'打開高低壓兩閥門後，再打開真空泵，開始抽真空作業。', tip:'順序：先開閥門，再開真空泵。'},
  {t:'抽到真空再抽 10 分鐘', d:'觀察冷氣高低壓量表，抽到真空後約再抽十分鐘，以確保系統內的水分完全清除。', tip:'水分留在系統內會結冰、腐蝕。'},
  {t:'關閥・停泵・等 10 分鐘', d:'先關掉高低壓兩閥門，再關掉真空泵；等過十分鐘確認真空量表沒有下降，抽真空才算完成。', tip:'順序：先關閥門，再關真空泵。量表下降＝有洩漏，要找出漏點。'},
];

createAnim({
  title: '分離式冷暖氣機抽真空的程序',
  steps: STEPS,
  groundY: -0.15,
  minDist: 1.0,
  sun: [4, 8, 6],
  views: {
    def:{dir:[0.45,0.3,0.84], dist:3.4, target:[0.3,0.9,0.4]},
    1:  {dir:[0.85,0.25,0.46], dist:1.6, target:[0.55,1.0,0.3]},
    2:  {dir:[0.6,0.3,0.74],   dist:3.2, target:[0.7,0.6,0.6]},
    4:  {dir:[0.3,0.2,0.93],   dist:1.6, target:[0.75,0.85,0.75]},
    5:  {dir:[0.3,0.2,0.93],   dist:2.4, target:[0.75,0.95,0.75]},
  },
  note: '室外側視角；尺寸與錶頭為示意。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed}) {
    const OU={x0:-0.4,x1:0.5,y0:0.8,y1:1.4,z0:0.1,z1:0.45};
    const HV={x:0.52,y:0.95,z:0.28}, LV={x:0.52,y:1.05,z:0.36};   // 高壓閥（細管）、低壓閥（粗管）
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#a8a29e',{roughness:1}),
      bracket: mat('#374151',{metalness:.5}), pad: mat('#111827'), unit: mat('#e5e7eb',{roughness:.5}), fan: mat('#475569'), grill: mat('#94a3b8'),
      valve: mat('#ca8a04',{metalness:.7, roughness:.3}), cu: mat('#b45309',{metalness:.7, roughness:.3}), insul: mat('#f1f5f9',{roughness:.9}),
      wrench: mat('#9ca3af',{metalness:.7, roughness:.3}), body: mat('#1f2937'), gaugeH: mat('#dc2626'), gaugeL: mat('#374151'), face: mat('#f8fafc'), needle: mat('#111827'),
      hoseR: mat('#dc2626'), hoseK: mat('#111827'), hoseY: mat('#facc15'), pump: mat('#f97316'), on: mat('#22c55e',{emissive:'#22c55e', emissiveIntensity:.9}), off: mat('#64748b'),
      air: mat('#fca5a5',{transparent:true, opacity:.45, depthWrite:false}), water: mat('#60a5fa',{roughness:.2}),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-1.4,-0.15,-0.3,1.6,0,1.6,M.slab));
    fixed(span(-1.4,0,-0.3,1.6,2.4,0,M.wall));
    // 已裝好的室外機與冷媒管
    fixed(group(...[OU.x0+0.1,OU.x1-0.1].map(x=>group(span(x-.02,OU.y0-0.4,0,x+.02,OU.y0,.04,M.bracket), span(x-.02,OU.y0-.04,0,x+.02,OU.y0,OU.z1+0.05,M.bracket), pipe([x,OU.y0-0.35,.02],[x,OU.y0-.02,OU.z1],.012,M.bracket), span(x-.04,OU.y0,OU.z0+0.03,x+.04,OU.y0+.025,OU.z1-0.03,M.pad)))));
    fixed(group(span(OU.x0,OU.y0+.025,OU.z0,OU.x1,OU.y1,OU.z1,M.unit), pipe([OU.x0+0.3,(OU.y0+OU.y1)/2,OU.z1+.002],[OU.x0+0.3,(OU.y0+OU.y1)/2,OU.z1+.004],.22,M.fan), span(OU.x1-0.25,OU.y0+0.1,OU.z1,OU.x1-0.05,OU.y1-0.1,OU.z1+.003,M.grill,NE)));
    fixed(group(pipe([HV.x-.02,HV.y,HV.z],[HV.x+.04,HV.y,HV.z],.018,M.valve), pipe([LV.x-.02,LV.y,LV.z],[LV.x+.04,LV.y,LV.z],.024,M.valve)));
    fixed(pipe([0.85,2.0,0.06],[0.85,1.2,0.06],.03,M.insul)); fixed(pipe([0.85,1.2,0.06],[0.62,1.0,0.32],.03,M.insul));
    fixed(group(pipe([0.62,1.0,0.32],[HV.x+.04,HV.y,HV.z],.008,M.cu), pipe([0.62,1.0,0.32],[LV.x+.04,LV.y,LV.z],.011,M.cu)));
    // 管內殘留空氣・水分（抽完後消失）
    for (let i=0;i<6;i++){ const b=new THREE.Mesh(new THREE.SphereGeometry(.018,8,6), (i%2?M.water:M.air).clone()); b.position.set(0.85+(i%2?.012:-.012),1.25+i*0.12,0.1); add(0, b, {until:3, drop:0, glow:false}); }
    add(0, label('管內有空氣與水分 → 要抽真空',0.5,2.15,0.3,1.9,'bad'),{until:0, drop:0, glow:false});

    /* ① 活動板手鬆開高低壓閥 */
    add(1, group(span(HV.x+.05,HV.y-.012,HV.z-.18,HV.x+.07,HV.y+.012,HV.z,M.wrench), span(HV.x+.035,HV.y-.03,HV.z-.02,HV.x+.085,HV.y+.03,HV.z+.02,M.wrench)),{until:1, drop:-.1});
    add(1, label('活動板手鬆開高壓閥・低壓閥',0.55,1.45,0.4,1.7),{until:1, drop:0, glow:false});
    add(1, label('高壓閥（細管）',HV.x+0.25,HV.y-0.12,HV.z+0.1,0.9),{until:2, drop:0, glow:false});
    add(1, label('低壓閥（粗管）',LV.x+0.25,LV.y+0.12,LV.z+0.1,0.9),{until:2, drop:0, glow:false});
    /* ② 量表：紅高、黑低、黃接泵 */
    const MG={x:0.78,y:0.8,z:0.78}, VP={x:1.1,y:0.12,z:0.9};
    const gauge=(x,m)=>group(pipe([x,MG.y+.03,MG.z],[x,MG.y+.03,MG.z+.035],.055,m), pipe([x,MG.y+.03,MG.z+.035],[x,MG.y+.03,MG.z+.037],.048,M.face));
    add(2, group(span(MG.x-.12,MG.y-.05,MG.z-.03,MG.x+.12,MG.y+.03,MG.z+.03,M.body), gauge(MG.x-.07,M.gaugeL), gauge(MG.x+.07,M.gaugeH)), {drop:.2});
    add(2, group(span(VP.x-.12,0,VP.z-.08,VP.x+.12,0.2,VP.z+.08,M.pump)),{drop:.2});
    const hose=(a,b,m)=>{ const mid=[(a[0]+b[0])/2,Math.min(a[1],b[1])-0.15,(a[2]+b[2])/2]; return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([a,mid,b].map(p=>new THREE.Vector3(...p))),30,.008,8), m.clone()); };
    add(2, hose([MG.x+.1,MG.y-.05,MG.z],[HV.x+.05,HV.y,HV.z+.03],M.hoseR),{delay:.3, drop:0, glow:false});
    add(2, hose([MG.x-.1,MG.y-.05,MG.z],[LV.x+.05,LV.y,LV.z+.03],M.hoseK),{delay:.5, drop:0, glow:false});
    add(2, hose([MG.x,MG.y-.05,MG.z],[VP.x,0.2,VP.z],M.hoseY),{delay:.7, drop:0, glow:false});
    add(2, label('紅管 → 高壓閥口',MG.x+0.35,MG.y+0.25,MG.z,1.1),{until:2, drop:0, glow:false});
    add(2, label('黑管 → 低壓閥口',MG.x-0.35,MG.y+0.4,MG.z,1.1),{until:2, drop:0, glow:false});
    add(2, label('黃管 → 真空泵',VP.x,0.45,VP.z,1.0),{until:2, drop:0, glow:false});
    /* ③ 開閥 → 開泵 */
    const lamp=(m)=>{ const s=new THREE.Mesh(new THREE.SphereGeometry(.025,10,8), m.clone()); s.position.set(VP.x+.08,0.22,VP.z); return s; };
    add(3, lamp(M.on),{until:4, drop:0, glow:false});
    add(3, arrow([LV.x+.1,LV.y+.1,LV.z+.2],[MG.x-.05,MG.y+.15,MG.z],M.hoseY),{until:4, drop:0, glow:false});
    add(3, arrow([MG.x+.05,MG.y-0.2,MG.z+.05],[VP.x,0.35,VP.z],M.hoseY),{until:4, drop:0, glow:false});
    add(3, label('① 先開高低壓兩閥門　② 再開真空泵',0.7,1.5,0.7,2.2),{until:3, drop:0, glow:false});
    /* ④ 抽到真空再抽約 10 分鐘 */
    { const n=box(.004,.04,.004,M.needle,NE); n.position.set(MG.x-.07,MG.y+.03+.0,MG.z+.04); n.rotation.z=1.1; add(4, n, {until:5, drop:0, glow:false}); }
    add(4, label('抽到真空後，約再抽 10 分鐘（除盡水分）',MG.x,MG.y+0.35,MG.z,2.2),{until:4, drop:0, glow:false});
    /* ⑤ 先關閥 → 再停泵 → 等 10 分鐘 */
    add(5, lamp(M.off),{drop:0, glow:false});
    add(5, label('① 先關兩閥門　② 再關真空泵',MG.x,MG.y+0.6,MG.z,1.8),{until:5, drop:0, glow:false});
    add(5, label('等 10 分鐘，真空量表沒有下降 → 完成',MG.x,MG.y+0.3,MG.z,2.1,'good'),{until:5, drop:0, glow:false});
  },
});
</script>
</body>
</html>
