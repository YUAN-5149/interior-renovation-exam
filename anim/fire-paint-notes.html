<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'施工中樣貌', d:'木作牆面正在塗防火塗料：左邊已塗兩道，右邊還是素材；地上有塗料桶。',
   tip:'題目：「室內裝修用防火塗料施工中應注意哪些事項？請列舉 5 項說明。」'},
  {t:'認可塗料・核對證明', d:'使用經認可的防火塗料，核對品名、批號與合格證明。', tip:'防火塗料要有認可證明，進場時核對桶上的品名與批號。'},
  {t:'塗佈量・濕膜計・分次塗', d:'依規定的塗佈量或膜厚施作，以濕膜計檢測，分次塗佈。', tip:'防火效果和膜厚直接相關，太薄就沒有防火時效。'},
  {t:'乾燥後再塗下一道', d:'每道須達規定乾燥時間後，再塗下一道。', tip:'未乾就疊塗，塗膜會起皺、剝落。'},
  {t:'溫濕度・通風・嚴禁煙火', d:'施工環境的溫濕度須符合規定，保持通風並嚴禁煙火。', tip:'塗料含溶劑，通風不良有中毒與火災風險。'},
  {t:'底材清潔・塗料相容', d:'底材清潔乾燥；與底漆、面漆須相容。', tip:'底漆、面漆和防火塗料不相容，會咬底或影響發泡防火效果。'},
  {t:'不得任意稀釋', d:'不得任意稀釋。', tip:'稀釋會降低固含量，膜厚就不夠。'},
  {t:'拍照紀錄', d:'拍攝施工前、中、後照片。', tip:'塗上去就看不出塗了幾道，照片是查驗的依據。'},
  {t:'專業人員監督・查核紀錄', d:'由專業施工技術人員現場監督，並作成查核紀錄。', tip:'查核紀錄要記錄塗佈道數、用量、膜厚檢測結果。'},
];

createAnim({
  title: '防火塗料施工注意事項',
  kind: 'notes',
  steps: STEPS,
  groundY: -0.15,
  minDist: 1.2,
  sun: [3, 7, 7],
  views: {
    def:{dir:[0.4,0.25,0.88], dist:5.0, target:[0,1.0,0.3]},
    1:  {dir:[0.45,0.55,0.7], dist:2.4, target:[-0.9,0.2,0.8]},
    2:  {dir:[0.35,0.15,0.92], dist:2.0, target:[-0.6,1.2,0]},
    6:  {dir:[0.45,0.55,0.7], dist:2.4, target:[0.5,0.2,0.8]},
  },
  note: '塗膜厚度有誇大。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed, mark}) {
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wood: mat('#d9b98a',{roughness:.7}),
      c1: mat('#f1f5f9',{roughness:.6}), c2: mat('#e2e8f0',{roughness:.5}),
      can: mat('#dc2626',{metalness:.3, roughness:.4}), lid: mat('#9ca3af',{metalness:.5}), badge: mat('#16a34a',{emissive:'#16a34a', emissiveIntensity:.4}),
      gauge: mat('#cbd5e1',{metalness:.6, roughness:.3}), meter: mat('#facc15'), dark: mat('#292524'),
      no: mat('#dc2626',{emissive:'#dc2626', emissiveIntensity:.5}), bottle: mat('#60a5fa',{roughness:.3}),
      cam: mat('#1f2937',{roughness:.4}), lens: mat('#38bdf8',{emissive:'#0ea5e9', emissiveIntensity:.3}),
      board: mat('#a16207'), paper: mat('#fafaf9'), fan: mat('#64748b'),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-2,-0.15,-0.3,2,0,1.6,M.slab));
    fixed(span(-2,0,-0.2,2,2.6,0,M.wood));
    fixed(span(-2,0,.0005,-0.2,2.6,.004,M.c1,NE)); fixed(span(-2,0,.004,-0.2,2.6,.007,M.c2,NE));   // 兩道塗膜
    [[-1.1,0.7],[-0.75,0.75]].forEach(([x,z])=> fixed(group(pipe([x,0,z],[x,0.32,z],.13,M.can), pipe([x,.32,z],[x,.34,z],.13,M.lid))));

    mark(1, -0.92,0.34,0.72,{face:'y', r:.35, text:'認可證明・品名・批號', ty:0.75, tw:1.3});
    add(1, span(-1.15,0.12,0.83,-1.05,0.22,0.835,M.badge,NE),{until:1, drop:0, glow:false});
    add(2, group(span(-0.65,1.15,.007,-0.55,1.25,.02,M.gauge)),{until:2, drop:0});
    mark(2, -0.6,1.2,.02,{r:.1, text:'濕膜計檢測膜厚・分次塗', ty:1.45, tw:1.4});
    add(3, label('第 1 道乾燥 → 再塗第 2 道',-1.0,2.15,0.2,1.6),{until:3, drop:0, glow:false});
    mark(3, -0.2,1.3,.008,{r:.2});
    add(4, group(span(1.3,1.3,.01,1.45,1.5,.04,M.meter), span(1.32,1.4,.04,1.43,1.47,.042,M.dark,NE), span(1.6,0,0.9,1.9,0.5,1.1,M.fan)),{until:4, drop:-.2});
    add(4, group(...[0,1].map(i=>{ const b=box(.3,.03,.02,M.no,NE); b.position.set(0.9,1.9,.05); b.rotation.z=i?.78:-.78; return b; })),{until:4, drop:0, glow:false});
    add(4, label('溫濕度合格・通風・嚴禁煙火',0.9,2.15,0.2,1.7),{until:4, drop:0, glow:false});
    mark(5, 0.9,1.0,.01,{r:.35, text:'底材清潔乾燥・底面漆相容', ty:1.55, tw:1.6});
    add(6, pipe([0.5,0,0.8],[0.5,0.3,0.8],.06,M.bottle),{until:6, drop:.2});
    add(6, group(...[0,1].map(i=>{ const b=box(.35,.03,.02,M.no,NE); b.position.set(0.5,0.18,0.88); b.rotation.z=i?.78:-.78; return b; })),{until:6, drop:0, glow:false});
    add(6, label('不得任意稀釋',0.5,0.6,0.85,1.0,'bad'),{until:6, drop:0, glow:false});
    add(7, group(span(0.2,1.3,0.6,0.42,1.45,0.7,M.cam), pipe([0.31,1.375,0.58],[0.31,1.375,0.54],.04,M.lens)),{until:7, drop:.15});
    add(7, label('拍攝施工前・中・後照片',0.3,1.8,0.6,1.5),{until:7, drop:0, glow:false});
    add(8, group(span(-0.3,1.0,0.6,0.0,1.4,0.62,M.board), span(-0.28,1.02,0.622,-0.02,1.36,0.624,M.paper,NE)),{until:8, drop:.15});
    add(8, label('專業人員監督・查核紀錄',-0.15,1.75,0.6,1.5),{until:8, drop:0, glow:false});
  },
});
</script>
