<!DOCTYPE html>

<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>窗簾安裝施工順序｜3D 工法動畫</title>
<meta name="description" content="室裝乙級：布料窗簾（窗簾盒內軌道）安裝 9 步驟施工順序 3D 互動動畫，含固定座、軌道、滑輪、掛勾、打摺調整。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'施工前', d:'窗戶上方已做好木作窗簾盒，要安裝雙開落地布簾。',
   tip:'窗簾在學科考了二十多題、術科考過附件與布料題。可搭配「窗簾尺寸丈量」注意事項動畫；本動畫步驟依一般施工實務整理，請對照課本確認。'},
  {t:'丈量確認', d:'確認窗簾尺寸、型式（落地／半腰）與開合方式。', tip:'詳細量法見「窗簾尺寸丈量注意事項」。'},
  {t:'確認補強位置', d:'確認窗簾盒內的補強角材位置，軌道要鎖在補強上。', tip:'窗簾很重，只鎖在矽酸鈣板上會拉脫。'},
  {t:'放樣軌道位置', d:'在窗簾盒內彈出軌道中心線，標出固定座位置。', tip:'軌道與窗簾盒前緣保持距離，窗簾才不會摩擦盒子。'},
  {t:'鎖固定座', d:'依標記間距鎖上軌道固定座。', tip:'兩端與接頭附近都要有固定座。'},
  {t:'安裝軌道', d:'把軌道扣上固定座，確認水平。', tip:'軌道不水平，窗簾會自己滑向一邊。'},
  {t:'裝滑輪・止擋', d:'在軌道內裝入滑輪（滑車），兩端裝止擋。', tip:'滑輪數量要配合掛勾數量。'},
  {t:'掛窗簾', d:'窗簾打摺帶上的掛勾，逐一掛到滑輪上。', tip:'從中間往兩側掛，左右才對稱。'},
  {t:'調整打摺與下擺', d:'整理打摺，確認下擺高度（落地約離地 1～2 cm）。', tip:'打摺倍率約 2～2.5 倍，褶子才飽滿。'},
  {t:'開合測試・綁帶', d:'開合測試是否順暢，安裝綁帶（勾帶）。', tip:'拉開時用綁帶把布收束整齊。'},
];

createAnim({
  title: '窗簾安裝施工順序',
  steps: STEPS,
  groundY: -0.15,
  minDist: 1.0,
  sun: [3, 7, 7],
  views: {
    def:{dir:[0.3,0.15,0.94], dist:5.6, target:[0,1.5,0.1]},
    2:  {dir:[0.45,-0.35,0.82], dist:2.4, target:[0,2.4,0.1]},
    3:  {dir:[0.45,-0.35,0.82], dist:2.4, target:[0,2.4,0.1]},
    4:  {dir:[0.45,-0.35,0.82], dist:2.4, target:[0,2.4,0.1]},
    5:  {dir:[0.45,-0.35,0.82], dist:2.4, target:[0,2.4,0.1]},
    6:  {dir:[0.45,-0.35,0.82], dist:2.0, target:[-0.9,2.4,0.1]},
  },
  note: '軌道與滑輪尺寸有放大。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed}) {
    const WX=1.0, WY0=0.9, WY1=2.3, BY=2.5, BD=0.22, BX=1.3, TZ=0.1, TY=BY-0.03;
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#eeece7',{roughness:.95}),
      frame: mat('#d1d5db',{metalness:.6, roughness:.3}), glass: mat('#bae6fd',{transparent:true, opacity:.35, depthWrite:false}),
      box: mat('#f5f5f4',{transparent:true, opacity:.55, depthWrite:false}), wood: mat('#dcb97f'), laser: mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.8}),
      tape: mat('#facc15',{emissive:'#eab308', emissiveIntensity:.3}), bracket: mat('#6b7280',{metalness:.5}), track: mat('#e5e7eb',{metalness:.6, roughness:.3}),
      runner: mat('#f8fafc'), stop: mat('#1f2937'), cloth: mat('#a78bfa',{roughness:.9}), tie: mat('#7c3aed'), level: mat('#facc15'),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-2.4,-0.15,-0.3,2.4,0,1.6,M.slab));
    fixed(span(-2.4,0,-0.25,2.4,2.9,0,M.wall));
    fixed(group(span(-WX,WY0,-.03,WX,WY0+.05,.02,M.frame), span(-WX,WY1-.05,-.03,WX,WY1,.02,M.frame), span(-WX,WY0,-.03,-WX+.05,WY1,.02,M.frame), span(WX-.05,WY0,-.03,WX,WY1,.02,M.frame), span(-.025,WY0,-.03,.025,WY1,.02,M.frame), span(-WX+.05,WY0+.05,-.01,WX-.05,WY1-.05,-.005,M.glass,NE)));
    // 窗簾盒（半透明，內有補強角材）
    const bx=span(-BX,BY,0,BX,BY+.02,BD,M.box,{shadow:false}); bx.renderOrder=2; fixed(bx);
    const fr=span(-BX,BY-0.2,BD-.02,BX,BY+.02,BD,M.box,{shadow:false}); fr.renderOrder=2; fixed(fr);
    fixed(span(-BX,BY-.04,0.05,BX,BY,0.15,M.wood));

    add(1, group(span(-WX-0.2,BY-0.25,BD+.01,WX+0.2,BY-0.23,BD+.02,M.tape,NE), span(WX+0.15,0.02,BD,WX+0.17,BY-.04,BD+.01,M.tape,NE)),{until:1, drop:0, glow:false});
    add(1, label('尺寸・型式・開合方式',0,2.85,0.3,1.4),{until:1, drop:0, glow:false});
    add(2, label('軌道要鎖在補強角材上',0,2.1,0.4,1.4),{until:2, drop:0, glow:false});
    add(2, span(-BX,BY-.045,0.05,BX,BY-.04,0.15,M.laser,NE),{until:2, drop:0, glow:false});
    const BKX=[-1.15,-0.6,0,0.6,1.15];
    add(3, span(-BX,BY-.041,TZ-.002,BX,BY-.04,TZ+.002,M.laser,NE),{until:3, drop:0, glow:false});
    BKX.forEach((x,i)=> add(3, group(span(x-.02,BY-.042,TZ-.02,x+.02,BY-.04,TZ-.016,M.laser,NE), span(x-.002,BY-.042,TZ-.03,x+.002,BY-.04,TZ+.03,M.laser,NE)),{delay:.3+i*.08, drop:0, until:3, glow:false}));
    BKX.forEach((x,i)=> add(4, span(x-.03,BY-.07,TZ-.025,x+.03,BY-.04,TZ+.025,M.bracket),{delay:i*.1, drop:-.15}));
    add(5, group(span(-1.25,TY-.06,TZ-.015,1.25,TY-.035,TZ+.015,M.track)),{drop:-.15});
    add(5, span(-0.3,TY-.09,TZ+.02,0.3,TY-.06,TZ+.05,M.level),{until:5, drop:-.15});
    { const g=group(); for (let x=-1.2;x<=1.21;x+=0.1) g.add(span(x-.012,TY-.08,TZ-.008,x+.012,TY-.06,TZ+.008,M.runner));
      g.add(span(-1.25,TY-.08,TZ-.02,-1.22,TY-.035,TZ+.02,M.stop)); g.add(span(1.22,TY-.08,TZ-.02,1.25,TY-.035,TZ+.02,M.stop));
      add(6, g, {drop:0}); }
    // 窗簾布（兩片，摺狀）
    const panel=(x0,x1)=>{ const g=group(); const n=Math.round((x1-x0)/0.08); for (let i=0;i<n;i++){ const xa=x0+i*(x1-x0)/n, xb=xa+(x1-x0)/n; g.add(span(xa,0.02,TZ-.03+(i%2)*0.04,xb,TY-.09,TZ-.02+(i%2)*0.04,M.cloth)); } return g; };
    add(7, panel(-1.2,-0.02),{drop:-.3, until:8}); add(7, panel(0.02,1.2),{delay:.3, drop:-.3, until:8});
    add(8, panel(-1.2,-0.02),{drop:0, until:8}); add(8, panel(0.02,1.2),{drop:0, until:8});
    add(8, label('打摺均勻・落地離地 1～2 cm',0,0.4,0.5,1.8),{until:8, drop:0, glow:false});
    add(9, panel(-1.25,-0.85),{drop:0}); add(9, panel(0.85,1.25),{drop:0});
    add(9, group(span(-1.27,1.0,TZ-.05,-0.83,1.04,TZ+.06,M.tie), span(0.83,1.0,TZ-.05,1.27,1.04,TZ+.06,M.tie)),{delay:.3, drop:0});
    add(9, label('開合順暢・綁帶收束',0,2.85,0.3,1.3),{until:9, drop:0, glow:false});
  },
});
</script>
</body>
</html>
