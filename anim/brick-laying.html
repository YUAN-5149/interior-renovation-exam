<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>砌磚砌築步驟｜3D 工法動畫</title>
<meta name="description" content="室裝乙級術科：裝修砌磚砌築 8 步驟（拌漿、撥漿、刮漿、砌頭、擠漿、刮除溢漿、勾縫、清潔）3D 互動動畫。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'施工前', d:'半 B 磚牆已砌到第 6 皮，接著砌第 7 皮。',
   tip:'術科填空題：「砌築步驟依序為拌漿、撥漿、刮漿、砌頭、(1)擠漿、(2)刮除溢漿、(3)勾縫、(4)清潔」。'},
  {t:'拌漿', d:'拌合 1:3 水泥砂漿。',
   tip:'紅磚砌築前要先澆水濕潤，避免磚吸走砂漿水分。'},
  {t:'撥漿', d:'用鏝刀把砂漿撥到下一皮磚的頂面。',
   tip:'撥漿要鋪滿整皮磚頂，水平縫才會飽滿。'},
  {t:'刮漿', d:'把砂漿刮平，控制厚度。',
   tip:'水平縫厚度約 1 cm；刮平後厚度一致，牆才會水平。'},
  {t:'砌頭', d:'在要砌的磚端面（頭）抹上砂漿。',
   tip:'磚頭抹漿是為了讓垂直縫也飽滿，不留空隙。'},
  {t:'擠漿（壓磚、敲實）', d:'把磚壓在砂漿上，往旁邊的磚擠，敲實，砂漿被擠出。',
   tip:'擠出砂漿代表灰縫飽滿；用鏝刀柄或橡皮槌敲實，並對齊水線。'},
  {t:'刮除溢漿', d:'用鏝刀刮除擠出灰縫外的砂漿。',
   tip:'趁砂漿未硬化前刮除，硬了就難清，也會弄髒磚面。'},
  {t:'勾縫', d:'以勾縫工具把灰縫壓實修整。',
   tip:'勾縫讓灰縫密實、整齊，清水磚牆尤其重要。'},
  {t:'清潔', d:'清潔磚面，完成這一皮的砌築。',
   tip:'砌築時沾到磚面的砂漿要隨時清掉。'},
];

createAnim({
  title: '砌磚砌築步驟',
  steps: STEPS,
  groundY: 0,
  minDist: 0.8,
  sun: [3, 8, 6],
  views: {
    def:{dir:[0.45,0.45,0.77], dist:2.6, target:[0.1,0.35,0]},
    1:  {dir:[0.5,0.55,0.67],  dist:2.2, target:[0.8,0.15,-0.2]},
    4:  {dir:[0.55,0.5,0.67],  dist:1.6, target:[0.75,0.42,0.25]},
    7:  {dir:[0.3,0.2,0.93],   dist:1.8, target:[0.1,0.3,0]},
  },
  note: '磚與灰縫為 CNS 紅磚約略比例（20×9.5×5.3 cm、縫 1 cm）。',
  build({THREE, mat, box, span, pipe, group, label, add, fixed}) {
    const BL=0.2, BW=0.095, BH=0.053, J=0.01, N=6;      // 磚尺寸、縫、已砌皮數
    const X0=-0.6, X1=0.6, Z0=-BW/2, Z1=BW/2;
    const C=BH+J;                                       // 每皮高度
    const M = {
      floor: mat('#d6d3d1',{roughness:1}),
      bricks:['#b45309','#a3460a','#c2410c','#9a3412'].map(c=>mat(c,{roughness:.9})),
      mortar:mat('#b8b2a8',{roughness:1}),
      wetM:  mat('#9a948a',{roughness:1}),
      tool:  mat('#57534e',{roughness:1}),
      tub:   mat('#1f2937',{roughness:.6}),
      steel: mat('#94a3b8',{metalness:.4, roughness:.4}),
      handle:mat('#7c2d12',{roughness:.6}),
      line:  mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.6}),
      blob:  mat('#a8a29e',{roughness:1}),
    };
    const NE={edges:false, shadow:false};

    fixed(span(-1.2,-0.02,-0.8,1.4,0,1.0,M.floor));
    // 已砌好的 6 皮（交丁）
    const courseBricks=(r)=>{ const out=[]; let x=X0-(r%2?BL/2:0);
      while (x<X1-1e-3){ const a=Math.max(x,X0), b=Math.min(x+BL,X1); if (b-a>.03) out.push([a,b]); x+=BL+J; } return out; };
    for (let r=0;r<N;r++){
      const y0=r*C;
      fixed(span(X0,y0,Z0+.004,X1,y0+J,Z1-.004,M.mortar,NE));                     // 水平縫
      courseBricks(r).forEach(([a,b],i)=>{
        fixed(span(a,y0+J,Z0,b,y0+C,Z1,M.bricks[(r*3+i)%4]));
        fixed(span(b,y0+J,Z0+.004,Math.min(b+J,X1),y0+C,Z1-.004,M.mortar,NE));     // 垂直縫
      });
    }
    const YT=N*C;                                        // 第 7 皮底

    /* ① 拌漿 */
    add(1, group(span(0.8,0,-0.45,1.3,0.12,-0.1,M.tub), span(0.83,0.1,-0.42,1.27,0.11,-0.13,M.wetM,NE)),{delay:0, drop:.3});
    add(1, group(span(1.0,0.12,-0.3,1.12,0.125,-0.22,M.steel), span(1.05,0.125,-0.27,1.07,0.2,-0.25,M.handle)),{delay:.4, drop:.2, until:3});

    /* 水線（對齊用） */
    add(2, pipe([X0-0.05,YT+C+.005,Z1+.01],[X1+0.05,YT+C+.005,Z1+.01],.0015,M.line),{delay:0, drop:0, until:6, glow:false});

    /* ② 撥漿（不平整的一坨坨） */
    { const g=group(); for (let i=0;i<8;i++){ const x=X0+0.05+i*0.15; g.add(span(x-.06,YT,Z0+.01,x+.06,YT+J*1.6,Z1-.01,M.wetM,NE)); }
      add(2, g, {delay:0, drop:.15, until:2}); }
    add(2, group(span(-0.1,YT+.03,Z1+.01,0.1,YT+.034,Z1+.09,M.steel), span(-0.01,YT+.034,Z1+.05,0.01,YT+.1,Z1+.07,M.handle)),{delay:.4, drop:.15, until:2});

    /* ③ 刮漿（刮平） */
    add(3, span(X0,YT,Z0+.004,X1,YT+J,Z1-.004,M.wetM,NE),{delay:0, drop:0});
    add(3, group(span(0.1,YT+J+.002,Z0-.02,0.3,YT+J+.006,Z1+.02,M.steel), span(0.19,YT+J+.006,Z1,0.21,YT+J+.07,Z1+.02,M.handle)),{delay:.2, drop:.15, until:3});

    /* ④ 砌頭（磚端抹漿） */
    add(4, group(span(0.62,0.35,0.15,0.82,0.35+BH,0.15+BW,M.bricks[1]), span(0.6,0.35,0.15,0.62,0.35+BH,0.15+BW,M.wetM)),{delay:0, drop:.2, until:4});
    add(4, label('磚頭抹漿',0.72,0.6,0.2,0.4),{delay:.3, drop:0, until:4, glow:false});

    /* ⑤ 擠漿：第 7 皮磚就位，灰縫擠出砂漿 */
    const top=courseBricks(N);
    top.forEach(([a,b],i)=>{
      add(5, group(span(a,YT+J,Z0,b,YT+C,Z1,M.bricks[(N*3+i)%4]),
                   span(b,YT+J,Z0+.004,Math.min(b+J,X1),YT+C,Z1-.004,M.wetM,NE)),{delay:i*.2, drop:.12});
      add(5, span(a,YT+J-.004,Z1,b,YT+J+.004,Z1+.008,M.blob,NE),{delay:i*.2+.4, drop:0, until:5});
      if (b<X1-.01) add(5, span(b-.002,YT+J,Z1,b+J+.002,YT+C,Z1+.008,M.blob,NE),{delay:i*.2+.45, drop:0, until:5});
    });
    add(5, label('壓磚・敲實・砂漿擠出',0,YT+C+0.16,0.1,0.8),{delay:.5, drop:0, until:5, glow:false});

    /* ⑥ 刮除溢漿 */
    add(6, group(span(-0.2,YT+J,Z1+.012,0.0,YT+J+.004,Z1+.08,M.steel), span(-0.11,YT+J+.004,Z1+.04,-0.09,YT+J+.06,Z1+.06,M.handle)),{delay:0, drop:.1, until:6});

    /* ⑦ 勾縫：所有灰縫壓出凹縫（深色線） */
    { const g=group();
      for (let r=0;r<=N;r++){ const y0=r*C; g.add(span(X0,y0+.002,Z1,X1,y0+J-.002,Z1+.0015,M.tool,NE));
        courseBricks(r).forEach(([a,b])=>{ if (b<X1-.01) g.add(span(b+.002,y0+J,Z1,b+J-.002,y0+C,Z1+.0015,M.tool,NE)); }); }
      add(7, g, {delay:.2, drop:0}); }
    add(7, group(span(0.15,0.2,Z1+.01,0.17,0.24,Z1+.03,M.steel), span(0.15,0.24,Z1+.02,0.17,0.4,Z1+.04,M.handle)),{delay:0, drop:.1, until:7});

    /* ⑧ 清潔 */
    add(8, label('清潔磚面・完成',0,YT+C+0.16,0.1,0.7),{delay:.2, drop:0, glow:false});
  },
});
</script>
</body>
</html>
