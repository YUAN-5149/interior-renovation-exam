<!DOCTYPE html>

<head>

<title>分離式冷暖氣機室外機安裝｜3D 工法動畫</title>
<meta name="description" content="室裝乙級（課本 6-4-12）：分離式冷暖氣機室外機安裝 7 項 3D 互動圖解：證照與安全、通風遮陰、膨脹螺絲與吸音墊、維修空間、遠離床頭與可燃氣體、排水、鹽害鏽蝕。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'室外機位置', d:'分離式冷暖氣機的室外機，以 L 型支架裝在外牆上（畫面為室外側）。',
   tip:'依課本 6-4-12「分離式冷暖氣機室外機安裝」共 7 項。'},
  {t:'證照・安全環境', d:'聘請有證照與有經驗者，且必須在安全環境下施作。', tip:'高處作業要繫安全帶、確認支撐，避免墜落。'},
  {t:'通風・遮陰', d:'選擇通風順暢、不日曬、有遮陰的地方；如有日曬需裝遮日棚。', tip:'散熱不良，冷房能力下降又耗電。'},
  {t:'膨脹螺絲・吸音墊', d:'以膨脹螺絲安裝堅固不震動，並加裝吸音墊，運轉低噪音不擾鄰。', tip:'吸音（防震）墊墊在機腳與支架之間。'},
  {t:'安裝與保養空間', d:'安裝與保養的空間須足夠，並能有效氣流循環，增加冷房能力。', tip:'出風口前方不可有阻擋，否則熱風被吸回來。'},
  {t:'遠離床頭・電器・可燃氣體', d:'遠離臥室床頭區、電器高頻區、可燃性氣體的附近，避免干擾。', tip:'噪音、震動、電磁干擾與火災風險。'},
  {t:'排水設備', d:'室外主機需安裝排水設備，不可遺漏或是忽略。', tip:'暖氣運轉（除霜）時室外機也會出水。'},
  {t:'溫泉區・海邊防鏽', d:'如在溫泉區或海邊高含鹽量區，需注意鏽蝕的問題。', tip:'可選用防鏽處理機種、不鏽鋼支架並定期保養。'},
];

createAnim({
  title: '分離式冷暖氣機室外機安裝',
  kind: 'notes',
  steps: STEPS,
  groundY: -0.15,
  minDist: 1.2,
  sun: [5, 8, -4],
  views: {
    def:{dir:[0.55,0.3,-0.78], dist:4.6, target:[0,1.2,-0.5]},
    3:  {dir:[0.7,0.15,-0.7],  dist:2.6, target:[0,0.85,-0.5]},
    5:  {dir:[-0.75,0.3,0.6],  dist:4.4, target:[-0.4,1.2,0]},
  },
  note: '機體與距離為示意。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed, mark}) {
    const T=0.2;
    const OU={x0:-0.45,x1:0.45,y0:0.9,y1:1.5,z0:-T-0.6,z1:-T-0.2};
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#c9c4bb',{roughness:1}), inwall: mat('#eeece7',{roughness:.95}),
      outdoor: mat('#e5e7eb',{roughness:.5}), fan: mat('#475569'), bracket: mat('#374151',{metalness:.5}), bolt: mat('#f97316'),
      pad: mat('#111827'), hood: mat('#78716c',{metalness:.3}), sun: mat('#fbbf24',{emissive:'#f59e0b', emissiveIntensity:.8}),
      air: mat('#38bdf8',{transparent:true, opacity:.3, depthWrite:false}), belt: mat('#f59e0b'), person: mat('#2563eb'), helmet: mat('#facc15'),
      bed: mat('#a78bfa'), gas: mat('#dc2626'), no: mat('#dc2626',{emissive:'#dc2626', emissiveIntensity:.5}),
      drain: mat('#94a3b8'), drop: mat('#60a5fa',{roughness:.2}), rust: mat('#9a3412',{roughness:1}), sea: mat('#0ea5e9',{transparent:true, opacity:.5, depthWrite:false}),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-1.6,-0.15,-1.8,1.6,0,1.0,M.slab));
    fixed(span(-1.4,0,-T,1.4,2.8,0,M.wall));
    fixed(span(-1.4,0,0,1.4,2.8,.004,M.inwall,NE));
    // 支架
    fixed(group(...[OU.x0+0.1,OU.x1-0.1].map(x=>group(span(x-.02,OU.y0-0.4,-T-.04,x+.02,OU.y0,-T,M.bracket), span(x-.02,OU.y0-.04,-T-0.65,x+.02,OU.y0,-T,M.bracket), pipe([x,OU.y0-0.35,-T-.02],[x,OU.y0-.02,-T-0.6],.012,M.bracket)))));
    // 室外機
    fixed(group(span(OU.x0,OU.y0+.03,OU.z0,OU.x1,OU.y1,OU.z1,M.outdoor), pipe([OU.x0+0.3,(OU.y0+OU.y1)/2,OU.z0-.002],[OU.x0+0.3,(OU.y0+OU.y1)/2,OU.z0-.006],.22,M.fan)));
    fixed(group(pipe([OU.x1-0.08,OU.y0+0.3,OU.z1],[OU.x1-0.08,OU.y0+0.3,-T],.012,M.drain), pipe([OU.x1-0.12,OU.y0+0.25,OU.z1],[OU.x1-0.12,OU.y0+0.25,-T],.008,M.drain)));

    /* ① 證照・安全 */
    add(1, group(pipe([1.0,0,-T-0.4],[1.0,0.9,-T-0.4],.07,M.person), (()=>{ const h=new THREE.Mesh(new THREE.SphereGeometry(.09,12,8), M.helmet.clone()); h.position.set(1.0,1.0,-T-0.4); return h; })(), pipe([1.0,0.75,-T-0.4],[0.6,1.8,-T-.02],.01,M.belt)),{until:1, drop:.1});
    add(1, label('有證照・有經驗者｜安全環境施作',0.3,2.2,-0.6,2.0),{until:1, drop:0, glow:false});
    /* ② 通風・遮陰 */
    { const s=new THREE.Mesh(new THREE.SphereGeometry(.18,16,12), M.sun.clone()); s.position.set(0.9,2.6,-1.5); add(2, s, {until:2, drop:0, glow:false}); }
    add(2, span(OU.x0-0.1,OU.y1+0.2,OU.z0-0.15,OU.x1+0.1,OU.y1+0.22,-T,M.hood),{drop:.2});
    add(2, label('通風順暢・遮陰｜日曬裝遮日棚',0,2.3,-0.7,1.9),{until:2, drop:0, glow:false});
    /* ③ 膨脹螺絲・吸音墊 */
    add(3, group(...[OU.x0+0.1,OU.x1-0.1].flatMap(x=>[span(x-.05,OU.y0,OU.z0+0.05,x+.05,OU.y0+.03,OU.z0+0.15,M.pad), span(x-.05,OU.y0,OU.z1-0.15,x+.05,OU.y0+.03,OU.z1-0.05,M.pad)])),{drop:0});
    [OU.x0+0.1,OU.x1-0.1].forEach((x,i)=>{ mark(3, x,OU.y0-0.3,-T-.04,{r:.04, face:'z'}); });
    add(3, label('膨脹螺絲鎖固・機腳加吸音墊',0,0.3,-0.6,1.7),{until:3, drop:0, glow:false});
    /* ④ 維修空間・氣流 */
    add(4, span(OU.x0,OU.y0+.03,OU.z0-0.6,OU.x1,OU.y1,OU.z0-0.01,M.air,NE),{until:4, drop:0, glow:false});
    add(4, arrow([OU.x0+0.3,(OU.y0+OU.y1)/2,OU.z0-0.05],[OU.x0+0.3,(OU.y0+OU.y1)/2,OU.z0-0.7],M.air),{until:4, drop:0, glow:false});
    add(4, label('安裝保養空間足夠・氣流循環',0,1.9,-1.1,1.7),{until:4, drop:0, glow:false});
    /* ⑤ 遠離床頭・可燃氣體（室內側看） */
    add(5, group(span(-1.2,0,0.01,-0.2,0.45,1.0,M.bed), span(-1.2,0.45,0.01,-0.2,0.9,0.1,M.bed)),{until:5, drop:.1});
    add(5, group(...[0,1].map(i=>{ const b=box(.6,.03,.02,M.no,NE); b.position.set(-0.7,1.2,0.05); b.rotation.z=i?.78:-.78; return b; })),{until:5, drop:0, glow:false});
    add(5, label('牆後是臥室床頭 → 避開',-0.7,1.7,0.2,1.3,'bad'),{until:5, drop:0, glow:false});
    add(5, label('也遠離電器高頻區・可燃性氣體',-0.4,2.2,0.2,1.9),{until:5, drop:0, glow:false});
    /* ⑥ 排水 */
    add(6, pipe([OU.x0+0.2,OU.y0,OU.z0+0.2],[OU.x0+0.2,0.02,OU.z0+0.2],.012,M.drain),{drop:0});
    for (let i=0;i<5;i++){ const d=new THREE.Mesh(new THREE.SphereGeometry(.014,8,6), M.drop.clone()); d.position.set(OU.x0+0.28,OU.y0-0.1-i*0.15,OU.z0+0.2); add(6, d, {delay:.3+i*.1, drop:0, until:6, glow:false}); }
    add(6, label('室外機加裝排水設備・不可遺漏',0,1.9,-0.6,1.8),{until:6, drop:0, glow:false});
    /* ⑦ 鹽害鏽蝕 */
    add(7, span(-1.6,0.001,-1.8,1.6,0.01,-1.1,M.sea,NE),{until:7, drop:0, glow:false});
    add(7, group(...[OU.x0+0.1,OU.x1-0.1].map(x=>span(x-.025,OU.y0-0.15,-T-0.3,x+.025,OU.y0+.005,-T-0.1,M.rust,NE))),{until:7, drop:0, glow:false});
    add(7, label('溫泉區・海邊高鹽分 → 注意鏽蝕',0,1.9,-0.7,1.9,'bad'),{until:7, drop:0, glow:false});
  },
});
</script>
</body>
</html>
