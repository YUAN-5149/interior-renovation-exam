<title>石膏板輕隔間施工順序｜3D 工法動畫</title>
<meta name="description" content="室裝乙級術科：石膏板輕隔間 10 步驟施工順序 3D 互動動畫，可逐步播放、旋轉視角、看剖面。">
<link rel="icon" href="../favicon.ico" sizes="any">

<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111803';

const STEPS = [
  {t:'施工前', d:'要在房間中間做一道有門洞的石膏板輕隔間。按「播放」或「下一步」開始。',
   tip:'術科常考「石膏板輕隔間施工步驟」：放樣 → 上下槽鐵 → 立柱 → 開口補強 → 管線 → 單面封板 → 隔音材 → 另一面封板 → 接縫處理 → 收邊。'},
  {t:'放樣', d:'依圖在地面、天花板、牆面彈出隔間位置線，並標出門窗開口。',
   tip:'放樣線是上下槽鐵的位置基準；門窗開口位置要在這一步就定出來。'},
  {t:'安裝上下槽鐵', d:'沿放樣線安裝上、下槽鐵，以擊釘或螺栓固定在樓板與地坪。',
   tip:'固定間距約 60 cm 以內；門口位置的下槽鐵要斷開。'},
  {t:'安裝立柱', d:'立柱插入上下槽鐵，依設計間距排列，並校正垂直。',
   tip:'立柱長度＝淨高減約 10 mm；間距常見 @40.6～60.9 cm，要配合板材寬度。立柱開口方向一致、穿線孔對齊。'},
  {t:'開口補強', d:'門洞兩側加設雙立柱，上方加楣樑，牆中加設橫撐。',
   tip:'開口處要用雙立柱或內襯角材補強，並加橫撐；開關門的震動才不會讓牆面開裂。'},
  {t:'管線配置', d:'水電管線穿過立柱預留孔，裝好出線盒並固定。',
   tip:'管線要在封板前完成並固定；要吊掛重物（冷氣、吊櫃）的位置，也要在封板前預設補強板。'},
  {t:'單面封板', d:'石膏板直向安裝在一側，以自攻螺絲鎖在立柱上。',
   tip:'螺絲間距：板邊約 @20 cm、中間約 @30 cm，距板邊約 1 cm，螺絲頭略低於板面。板材接縫要落在立柱上。'},
  {t:'填充隔音材', d:'從還沒封板的一側，把岩棉或玻璃棉填滿立柱之間。',
   tip:'隔音材要填滿、不留空隙；岩棉兼具防火效果。'},
  {t:'另一面封板', d:'封另一面石膏板，接縫與對面錯開。',
   tip:'兩面接縫錯開，不落在同一支立柱上，牆體較不易沿接縫開裂。'},
  {t:'接縫處理', d:'板材接縫貼上接縫帶，再分次批土、研磨平整。',
   tip:'順序：貼接縫帶 → 分次批土 → 研磨；螺絲孔也要補土。'},
  {t:'收邊', d:'陽角裝上護角條，再進行塗裝或貼壁紙，完成輕隔間。',
   tip:'護角條保護轉角不易撞壞；收邊完成後才做面材（塗裝、壁紙）。'},
];

createAnim({
  title: '石膏板輕隔間施工順序',
  steps: STEPS,
  groundY: -0.15,
  sun: [3, 8, 6],
  views: {
    def:{dir:[0.45,0.32,0.83], dist:7.6, target:[0,1.15,0]},
    1:  {dir:[0.45,0.8,0.55], dist:8.8, target:[0,0.7,0]},
    4:  {dir:[0.35,0.22,0.91], dist:5.6, target:[0.9,1.5,0]},
    5:  {dir:[0.3,0.25,0.92], dist:5.8, target:[-0.6,0.8,0]},
    7:  {dir:[0.4,0.3,-0.86], dist:7.6, target:[0,1.15,0]},
    8:  {dir:[0.4,0.3,-0.86], dist:7.6, target:[0,1.15,0]},
    9:  {dir:[0.32,0.22,0.92], dist:6.6, target:[-0.4,1.2,0]},
  },
  cut: {
    front:[new THREE.Plane(new THREE.Vector3(-1,0,0), -0.6)],
    wool: [new THREE.Plane(new THREE.Vector3(-1,0,0), 0.2)],
  },
  cutLabel: '切開正面石膏板與隔音材，看裡面的骨架',
  note: '模型的鋼材、板材厚度有誇大，方便看清楚各層構造。',
  build({mat, box, span, pipe, group, add, fixed}) {
    /* 尺寸（公尺） */
    const X0=-1.95, X1=1.95, HC=2.4;         // 隔間長度、淨高
    const SD=0.0375, F=0.035, T=0.006;        // 立柱深度一半、翼寬、鋼板厚（放大）
    const DX0=0.55, DX1=1.45, DH=2.1;         // 門洞
    const BZ=SD+T+0.001, BT=0.014;            // 石膏板位置、厚度

    const M = {
      slab:  mat('#d3cec8',{roughness:1}),
      wall:  mat('#f5f4f1',{roughness:.95}),
      ghost: mat('#ffffff',{transparent:true, opacity:.14, depthWrite:false, roughness:1}),
      steel: mat('#b9c1c9',{metalness:.25, roughness:.45}),
      steel2:mat('#8f9aa5',{metalness:.25, roughness:.45}),
      pin:   mat('#292524',{roughness:.5}),
      laser: mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.8}),
      dev:   mat('#facc15',{roughness:.5}),
      dark:  mat('#44403c',{roughness:.6}),
      elec:  mat('#f97316',{roughness:.5}),
      ebox:  mat('#1d4ed8',{roughness:.6}),
      board: mat('#f1eee6',{roughness:.95}),
      wool:  mat('#d6b65e',{roughness:1}),
      tape:  mat('#ffffff',{roughness:1}),
      mud:   mat('#e7e5e4',{roughness:1}),
      bead:  mat('#9ca3af',{metalness:.3, roughness:.4}),
      paint: mat('#e6dccb',{roughness:.9}),
    };
    const NE = {edges:false, shadow:false};

    // 樓板、左側牆、天花樓板（半透明）
    fixed(span(-2.15,-0.15,-1.2, 2.15,0,1.2, M.slab));
    fixed(span(-2.15,0,-1.2, X0,HC,1.2, M.wall));
    const ceil = span(-2.15,HC,-1.2, 2.15,HC+0.15,1.2, M.ghost,{shadow:false});
    ceil.receiveShadow=false; ceil.children[0].material.opacity=.45; fixed(ceil);

    /* ① 放樣 */
    { const t=.004, w=.008, LA={drop:0, until:2, glow:false};
      let k=0;
      for (const z of [-(SD+T), SD+T]) {
        add(1, span(X0,0.001,z-w/2,X1,0.001+t,z+w/2,M.laser,NE),{...LA,delay:.3+(k)*.1});
        add(1, span(X0,HC-0.001-t,z-w/2,X1,HC-0.001,z+w/2,M.laser,NE),{...LA,delay:.5+(k)*.1});
        add(1, span(X0,0,z-w/2,X0+t,HC,z+w/2,M.laser,NE),{...LA,delay:.7+(k++)*.1});
      }
      for (const x of [DX0, DX1])                                           // 門洞記號
        add(1, span(x-w/2,0.001,-0.18,x+w/2,0.001+t,0.18,M.laser,NE),{...LA,delay:1.0});
      const head = box(.16,.12,.16,M.dev); head.position.y = 1.1;
      const lens = box(.17,.05,.06,M.dark,{edges:false}); lens.position.y = 1.1;
      const dev = group(head, lens);
      for (let a=0;a<3;a++){ const ang=a*Math.PI*2/3+.3; dev.add(pipe([0,1.04,0],[Math.cos(ang)*.25,0,Math.sin(ang)*.25],.012,M.dark)); }
      dev.position.set(-0.3,0,0.9);
      add(1, dev, {delay:0, drop:.5, until:2}); }

    /* ② 上下槽鐵（U 型）＋擊釘 */
    function runner(xa, xb, y, up, m=M.steel) {        // up=true 開口朝上（地槽）
      const s = up ? 1 : -1, yw0 = y, yw1 = y + s*T, yf = y + s*0.035;
      const g = group(
        span(xa,Math.min(yw0,yw1),-SD-T,xb,Math.max(yw0,yw1),SD+T,m),
        span(xa,Math.min(y,yf),SD,xb,Math.max(y,yf),SD+T,m),
        span(xa,Math.min(y,yf),-SD-T,xb,Math.max(y,yf),-SD,m));
      return g;
    }
    function pins(xa, xb, y) {
      const g = group();
      for (let x=xa+0.15; x<xb-0.05; x+=0.55) { const p=pipe([x,y,0],[x,y+0.012,0],.011,M.pin); g.add(p); }
      return g;
    }
    add(2, runner(X0,DX0,0,true),{delay:0, drop:.5});
    add(2, runner(DX1,X1,0,true),{delay:.15, drop:.5});
    add(2, runner(X0,X1,HC,false),{delay:.3, drop:-.5});
    add(2, pins(X0,DX0,T),{delay:.75, drop:.25, glow:false});
    add(2, pins(DX1,X1,T),{delay:.85, drop:.25, glow:false});
    add(2, pins(X0,X1,HC-T-0.012),{delay:.95, drop:-.25, glow:false});

    /* ③ 立柱（C 型） */
    function stud(xc, y0=T+0.002, y1=HC-0.012, m=M.steel) {
      const xa=xc-F/2, xb=xc+F/2;
      return group(
        span(xa,y0,-SD,xa+T,y1,SD,m),               // 腹板（開口方向一致：都朝 +x）
        span(xa,y0,SD-T,xb,y1,SD,m),                // 翼板
        span(xa,y0,-SD,xb,y1,-SD+T,m));
    }
    const STUDS = [X0+F/2, -1.495, -1.04, -0.585, -0.13, 0.325, DX0-F/2, DX1+F/2, X1-F/2];
    STUDS.forEach((x,i)=> add(3, stud(x),{delay:i*.12, drop:.7}));

    /* ④ 開口補強：雙立柱、楣樑、短柱、橫撐 */
    add(4, stud(DX0-F*1.5, T+0.002, HC-0.012, M.steel2),{delay:0, drop:.6});
    add(4, stud(DX1+F*1.5, T+0.002, HC-0.012, M.steel2),{delay:.12, drop:.6});
    add(4, runner(DX0,DX1,DH,true,M.steel2),{delay:.35, drop:.5});
    add(4, stud((DX0+DX1)/2, DH+T, HC-0.012, M.steel2),{delay:.55, drop:.4});
    add(4, span(X0,1.19,-0.008,DX0-F*2,1.21,0.008,M.steel2),{delay:.8, drop:.3});
    add(4, span(DX1+F*2,1.19,-0.008,X1,1.21,0.008,M.steel2),{delay:.9, drop:.3});

    /* ⑤ 管線＋出線盒 */
    { const y=0.3, r=0.013, sx=0.40;
      add(5, pipe([X0,y,0],[sx,y,0],r,M.elec),{delay:0, drop:.3});
      add(5, pipe([sx,y,0],[sx,1.16,0],r,M.elec),{delay:.2, drop:.3});
      add(5, span(-1.33,y-0.06,-0.025,-1.2,y+0.06,BZ+BT+0.009,M.ebox),{delay:.45, drop:.25});
      add(5, span(sx-0.045,1.14,-0.025,sx+0.045,1.26,BZ+BT+0.009,M.ebox),{delay:.55, drop:.25}); }

    /* 石膏板＋自攻螺絲 */
    const ALLSTUDS = [...STUDS, DX0-F*1.5, DX1+F*1.5, (DX0+DX1)/2].sort((a,b)=>a-b);
    function board(xa, xb, ya, yb, side) {            // side=+1 正面、-1 背面
      const z0 = side>0 ? BZ : -BZ-BT, z1 = z0+BT, gap=.002;
      const g = group(span(xa+gap,ya,z0,xb-gap,yb,z1,M.board));
      const zf = side>0 ? z1+0.001 : z0-0.001;
      ALLSTUDS.forEach(sx=>{
        if (sx < xa-0.02 || sx > xb+0.02) return;
        const edge = sx-xa < 0.05 || xb-sx < 0.05;           // 板邊 @20、中間 @30
        const x = Math.min(Math.max(sx, xa+0.012), xb-0.012);
        const step = edge ? 0.2 : 0.3;
        for (let y=ya+0.1; y<yb-0.05; y+=step) {
          const s=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.002,10), M.pin.clone());
          s.rotation.x=Math.PI/2; s.position.set(x,y,zf); g.add(s);
        }
      });
      return g;
    }
    const FRONT = [[X0,-1.04],[-1.04,-0.13],[-0.13,DX0],[DX1,X1]];
    const BACK  = [[X0,-1.495],[-1.495,-0.585],[-0.585,0.325],[0.325,DX0],[DX1,X1]];
    const B0=0.01, B1=HC-0.005;

    /* ⑥ 單面封板（正面） */
    FRONT.forEach(([a,b],i)=> add(6, board(a,b,B0,B1,1),{delay:i*.22, drop:.6, cat:'front'}));
    add(6, board(DX0,DX1,DH,B1,1),{delay:.9, drop:.4, cat:'front'});

    /* ⑦ 隔音材（從背面塞） */
    { let k=0;
      for (let i=0;i<ALLSTUDS.length-1;i++){
        const a=ALLSTUDS[i]+F/2+0.004, b=ALLSTUDS[i+1]-F/2+T-0.002;
        if (b-a<0.05) continue;
        const inDoor = a>DX0-0.01 && b<DX1+0.01;
        const y0 = inDoor ? DH+0.04 : 0.05;
        add(7, span(a,y0,-0.03,b,HC-0.05,0.03,M.wool,{shadow:false}),{delay:(k++)*.12, drop:0, cat:'wool'});
      } }

    /* ⑧ 另一面封板（背面，接縫錯開） */
    BACK.forEach(([a,b],i)=> add(8, board(a,b,B0,B1,-1),{delay:i*.2, drop:.6}));
    add(8, board(DX0,DX1,DH,B1,-1),{delay:1.0, drop:.4});

    /* ⑨ 接縫處理（正面）：接縫帶 → 批土 */
    { const zf=BZ+BT, joints=[-1.04,-0.13];
      joints.forEach((x,i)=>{
        add(9, span(x-0.025,B0,zf,x+0.025,B1,zf+0.002,M.tape,NE),{delay:i*.15, drop:0, cat:'front'});
        add(9, span(x-0.1,B0,zf+0.002,x+0.1,B1,zf+0.004,M.mud,NE),{delay:.7+i*.15, drop:0, cat:'front'});
      });
      for (const x of [DX0, DX1]) {
        add(9, span(x-0.025,DH,zf,x+0.025,B1,zf+0.002,M.tape,NE),{delay:.3, drop:0, cat:'front'});
        add(9, span(x-0.1,DH,zf+0.002,x+0.1,B1,zf+0.004,M.mud,NE),{delay:1.0, drop:0, cat:'front'});
      } }

    /* ⑩ 收邊：護角條 → 塗裝 */
    { const b=0.02;
      for (const s of [1,-1]) {
        const zf = s>0 ? BZ+BT : -BZ-BT, za=Math.min(zf, zf+s*0.004), zb=Math.max(zf,zf+s*0.004);
        add(10, span(DX0-b,0,za,DX0+0.002,DH+0.002,zb,M.bead,NE),{delay:0, drop:.3});
        add(10, span(DX1-0.002,0,za,DX1+b,DH+0.002,zb,M.bead,NE),{delay:.1, drop:.3});
        add(10, span(DX0-b,DH-0.002,za,DX1+b,DH+b,zb,M.bead,NE),{delay:.2, drop:.3});
        const zp0 = s>0 ? BZ+BT+0.005 : -BZ-BT-0.007, zp1 = zp0+0.002;
        const cat = s>0 ? 'front' : '';
        add(10, span(X0,B0,zp0,DX0-b,B1,zp1,M.paint,NE),{delay:.6, drop:0, cat});
        add(10, span(DX1+b,B0,zp0,X1,B1,zp1,M.paint,NE),{delay:.75, drop:0, cat});
        add(10, span(DX0-b,DH+b,zp0,DX1+b,B1,zp1,M.paint,NE),{delay:.9, drop:0, cat});
      } }
  },
});
</script>
</body>
</html>
