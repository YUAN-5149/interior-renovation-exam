<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>磁磚分割計畫與橫線基準法｜3D 工法動畫</title>
<meta name="description" content="室裝乙級術科：牆面磁磚分割計畫與橫線基準法放樣 8 步驟 3D 互動動畫，含避免小於 1/3 碎磚、基準水平線、控制線、托木。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'施工前', d:'一面淨寬 280 cm、淨高 240 cm 的牆，要貼 30×30 cm 磁磚（縫寬 5 mm）。',
   tip:'術科考過「牆面磁磚基準放樣中，橫線基準法的放樣方式」。答案第一步就是「先做磁磚分割計畫，避免出現小於 1/3 的碎磚」。'},
  {t:'量測淨寬淨高', d:'量測牆面淨寬、淨高，確認磁磚尺寸與縫寬。', tip:'分割計畫是「圖上放樣」，要用現場實測尺寸來算。'},
  {t:'✗ 從一側開始排', d:'若從左邊開始排整磚，最右邊只剩約 5.5 cm 的碎磚。', tip:'5.5 cm 小於磚寬 30 cm 的 1/3（10 cm），太小不好貼、容易脫落，也很難看。'},
  {t:'✓ 置中分割', d:'改成置中排列：中間 8 塊整磚，兩側各裁 18 cm，左右對稱且都大於 1/3。', tip:'計算：280 －（8 × 30.5）＝ 36 cm，兩側各 18 cm ≥ 10 cm。'},
  {t:'彈基準水平線', d:'以雷射水平儀或水平管在牆面引出基準水平線（例如 FL＋100 cm），用墨斗彈線。', tip:'FL 是地板面（Floor Level），FL＋100 就是離地 100 cm。'},
  {t:'上下累計排數', d:'以基準線為準，向上、向下按「磚高＋縫寬」累計，決定最下排與最上排位置。', tip:'讓地面與天花的收頭整齊；裁切磚盡量放在不顯眼的位置。'},
  {t:'每 4～5 排彈控制線', d:'每隔數排（例如 4～5 排或約 1 m）再彈一條橫向控制線。', tip:'控制線可以控制累積誤差，貼到後面才不會越貼越歪。'},
  {t:'垂直線檢核・控制網', d:'轉角、門窗開口處，配合垂直線（鉛錘或雷射）檢核，形成水平垂直的控制網。', tip:'橫線控制水平，垂直線控制直縫，兩者組成控制網。'},
  {t:'托木・由下往上貼', d:'最下排先釘臨時托木支撐，由下往上鋪貼，並隨時對齊橫線；最後拆除托木，補貼最下排。', tip:'托木（靠尺）讓第一排磚不會下滑，也保證第一排是水平的。'},
];

createAnim({
  title: '磁磚分割計畫與橫線基準法',
  steps: STEPS,
  groundY: -0.15,
  sun: [3, 7, 7],
  views: {
    def:{dir:[0.3,0.15,0.94], dist:5.2, target:[0,1.2,0]},
    2:  {dir:[0.3,0.12,0.95], dist:3.4, target:[0.9,1.2,0]},
    3:  {dir:[0.3,0.12,0.95], dist:5.0, target:[0,1.2,0]},
  },
  note: '縫寬與裁切尺寸依題目示意。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed}) {
    const W=2.8, H=2.4, X0=-W/2, X1=W/2, P=0.305, T=0.3, Z=0.003;
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#c9c4bb',{roughness:1}), side: mat('#bdb8b0',{roughness:1}),
      laser: mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.8}), blue: mat('#2563eb',{emissive:'#2563eb', emissiveIntensity:.6}),
      bad: mat('#fecaca',{transparent:true, opacity:.75, depthWrite:false}), badCut: mat('#dc2626',{transparent:true, opacity:.85, depthWrite:false}),
      good: mat('#bbf7d0',{transparent:true, opacity:.75, depthWrite:false}), goodCut: mat('#16a34a',{transparent:true, opacity:.7, depthWrite:false}),
      tiles: ['#eef1f3','#e8ecef','#f3f5f6'].map(c=>mat(c,{roughness:.22})), cut: mat('#dbe3ea',{roughness:.22}),
      wood: mat('#a16207'), dev: mat('#facc15'), dark: mat('#292524'), meter: mat('#f97316'),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-2.2,-0.15,-0.3,2.2,0,1.6,M.slab));
    fixed(span(X0,0,-0.2,X1,H,0,M.wall));
    fixed(span(-2.2,0,-0.2,X0,H+0.2,1.0,M.side)); fixed(span(X1,0,-0.2,2.2,H+0.2,1.0,M.side));
    fixed(span(-2.2,H,-0.2,2.2,H+0.2,0.2,M.side));

    /* ① 量測 */
    add(1, group(arrow([X0+.02,0.5,.03],[X1-.02,0.5,.03],M.meter), arrow([X1-.02,0.5,.03],[X0+.02,0.5,.03],M.meter)),{until:1, drop:0, glow:false});
    add(1, group(arrow([1.1,0.02,.03],[1.1,H-.02,.03],M.meter), arrow([1.1,H-.02,.03],[1.1,0.02,.03],M.meter)),{until:1, drop:0, glow:false, delay:.2});
    add(1, label('淨寬 280 cm',0,0.75,0.1,0.9),{until:1, drop:0, glow:false});
    add(1, label('淨高 240 cm',0.75,1.5,0.1,0.9),{until:1, drop:0, glow:false});
    /* ② ✗ 從左排：最右碎磚 */
    { const g=group(); for (let c=0;c<10;c++){ const a=X0+c*P, b=Math.min(a+T,X1); if (b-a<.01) break; g.add(span(a,1.0,Z,b,1.0+T,Z+.002,(b-a<0.1)?M.badCut:M.bad,NE)); } add(2, g, {until:2, drop:0, glow:false}); }
    add(2, label('✗ 最右剩 5.5 cm（< 1/3）',1.0,1.7,0.1,1.5,'bad'),{until:2, drop:0, glow:false});
    /* ③ ✓ 置中分割 */
    const EDGE=(W-8*P)/2, XS=[X0, X0+EDGE]; for (let i=1;i<=8;i++) XS.push(X0+EDGE+i*P); XS.push(X1);
    { const g=group(); for (let i=0;i<XS.length-1;i++){ const a=XS[i]+.0025, b=XS[i+1]-.0025; g.add(span(a,1.0,Z,b,1.0+T,Z+.002,(i===0||i===XS.length-2)?M.goodCut:M.good,NE)); } add(3, g, {until:3, drop:0, glow:false}); }
    add(3, label('✓ 兩側各 18 cm（≥ 1/3）',0,1.7,0.1,1.5,'good'),{until:3, drop:0, glow:false});
    /* ④ 基準水平線 FL+100 */
    add(4, span(X0,1.0-.004,Z,X1,1.0+.004,Z+.003,M.laser,NE),{until:8, drop:0, glow:false});
    add(4, group(span(-0.08,0.95,0.5,0.08,1.05,0.66,M.dev), span(-0.03,0.97,0.49,0.03,1.03,0.5,M.dark,NE), pipe([0,0.95,0.58],[0.2,0,0.8],.01,M.dark), pipe([0,0.95,0.58],[-0.2,0,0.8],.01,M.dark), pipe([0,0.95,0.58],[0,0,0.3],.01,M.dark)),{until:4, drop:.3});
    add(4, label('基準線 FL＋100 cm',-0.8,1.2,0.1,1.2),{until:5, drop:0, glow:false});
    /* ⑤ 上下累計排數（行線） */
    const ROWS=[]; for (let y=0;y<H-.01;y+=P) ROWS.push(y);
    add(5, group(...ROWS.map(y=>span(X0,y-.0015,Z,X1,y+.0015,Z+.002,M.blue,NE))),{until:5, drop:0, glow:false});
    add(5, label('最下排整磚・最上排裁切 26.5 cm',0.3,2.6,0.2,1.9),{until:5, drop:0, glow:false});
    /* ⑥ 控制線（每 4 排） */
    add(6, group(...[ROWS[4]].map(y=>span(X0,y-.004,Z,X1,y+.004,Z+.003,M.laser,NE))),{until:8, drop:0, glow:false});
    add(6, label('每 4～5 排一條控制線',0.6,1.6,0.1,1.3),{until:6, drop:0, glow:false});
    /* ⑦ 垂直線＋控制網 */
    add(7, group(...[XS[1],0,XS[XS.length-2]].map(x=>span(x-.004,0,Z,x+.004,H,Z+.003,M.laser,NE))),{until:8, drop:0, glow:false});
    add(7, label('水平線 × 垂直線＝控制網',0,2.6,0.2,1.6),{until:7, drop:0, glow:false});
    /* ⑧ 托木＋由下往上貼 */
    add(8, span(X0,ROWS[1]-.04,Z+.004,X1,ROWS[1]-.004,Z+.04,M.wood),{drop:-.2});
    { let k=0; for (let r=1;r<ROWS.length;r++){ const y0=ROWS[r]+.0025, y1=Math.min(ROWS[r]+T,H)-.0025; for (let i=0;i<XS.length-1;i++){ const cut=(i===0||i===XS.length-2||y1-y0<T-.01);
        add(8, span(XS[i]+.0025,y0,Z+.004,XS[i+1]-.0025,y1,Z+.012,cut?M.cut:M.tiles[(r+i)%3]),{delay:.4+r*.18+i*.01, drop:.15}); } } }
    add(8, label('托木支撐 → 由下往上貼',0,2.6,0.2,1.5),{until:8, drop:0, glow:false});
    add(8, label('最下排：拆托木後補貼',0,0.15,0.2,1.3),{until:8, drop:0, glow:false, delay:2.5});
  },
});
</script>
</body>
</html>
