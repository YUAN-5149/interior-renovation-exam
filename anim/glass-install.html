<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玻璃安裝施作項目｜3D 工法動畫</title>
<meta name="description" content="室裝乙級術科：指定玻璃及鑲嵌材料安裝應包括的施作項目 7 項，含安裝後清潔要點 3D 互動圖解。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'完成樣貌', d:'鋁框玻璃隔間：玻璃嵌在框內，底部有墊塊，周邊有底襯材與矽利康，外側有壓條。',
   tip:'題目：「門、窗、隔間、欄杆、扶手等經指定玻璃時，玻璃及鑲嵌之材料安裝應包括哪些施作項目？」另有一題問「驗收前玻璃的清理工作」。'},
  {t:'玻璃安裝就位', d:'玻璃裁切、磨邊後就位。', tip:'玻璃邊緣要磨邊，避免安裝時應力集中而破裂，也避免割傷。'},
  {t:'定位墊塊與間隔塊', d:'設置定位墊塊（底墊塊）與間隔塊。', tip:'底墊塊讓玻璃不直接壓在金屬框上；間隔塊讓玻璃四周間隙均勻。'},
  {t:'填縫材料', d:'填縫材料：矽利康（玻璃膠）、填縫條、墊條。', tip:'填縫材料讓玻璃與框之間防水、緩衝。'},
  {t:'底襯材', d:'設置底襯材（背襯材）。', tip:'底襯材控制矽利康的深度，並讓矽利康只黏兩面，保持彈性。'},
  {t:'壓條・固定框・五金夾具', d:'安裝玻璃壓條、固定框、五金夾具。', tip:'壓條把玻璃固定在框內，不會鬆動。'},
  {t:'安裝後清潔', d:'安裝後清潔玻璃。', tip:'用中性清潔劑與軟布、橡膠刮刀，由上而下清洗；不可用刀片、鋼絲絨硬刮，也不可用強酸強鹼。'},
  {t:'防撞警示・成品保護', d:'貼防撞警示標示並做成品保護。', tip:'大片透明玻璃容易被誤撞，要在視線高度貼警示標示。'},
];

createAnim({
  title: '玻璃安裝施作項目',
  kind: 'notes',
  steps: STEPS,
  groundY: -0.15,
  minDist: 1.0,
  sun: [3, 8, 6],
  views: {
    def:{dir:[0.5,0.25,0.83], dist:4.6, target:[0,1.1,0]},
    2:  {dir:[0.6,0.35,0.72], dist:1.6, target:[-0.3,0.1,0]},
    3:  {dir:[0.6,0.3,0.74],  dist:1.4, target:[0.8,0.6,0]},
    4:  {dir:[0.6,0.3,0.74],  dist:1.4, target:[0.8,0.6,0]},
    5:  {dir:[0.6,0.3,0.74],  dist:1.6, target:[0.8,0.9,0]},
  },
  note: '框料、墊塊與間隙尺寸有放大。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed, mark}) {
    const GX=0.8, GH=2.2, GT=0.012, FD=0.06, FW=0.05, gap=0.012;
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#eeece7',{roughness:.95}),
      alu: mat('#4b5563',{metalness:.5, roughness:.35}), glass: mat('#bae6fd',{transparent:true, opacity:.35, roughness:.05, depthWrite:false}),
      edge: mat('#7dd3fc',{roughness:.2}), block: mat('#111827',{roughness:.8}), spacer: mat('#f97316',{roughness:.6}),
      rod: mat('#f8fafc',{roughness:.6}), sil: mat('#9ca3af',{roughness:.4}), bead: mat('#374151',{metalness:.5, roughness:.35}),
      clean: mat('#facc15',{roughness:1}), drop: mat('#60a5fa',{roughness:.2}), sticker: mat('#dc2626',{emissive:'#dc2626', emissiveIntensity:.4}),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-2,-0.15,-1,2,0,1.4,M.slab));
    fixed(span(-2,0,-0.8,2,2.5,-0.7,M.wall));
    // 框（U 型槽：底、頂、兩側）
    const frame=(x0,y0,x1,y1)=>{ fixed(span(x0,y0,-FD/2,x1,y1,-FD/2+.006,M.alu)); fixed(span(x0,y0,FD/2-.006,x1,y1,FD/2,M.alu)); };
    fixed(span(-GX-FW,0,-FD/2,GX+FW,.008,FD/2,M.alu)); frame(-GX-FW,0,GX+FW,FW);
    fixed(span(-GX-FW,GH+2*FW-.008,-FD/2,GX+FW,GH+2*FW,FD/2,M.alu)); frame(-GX-FW,GH+FW,GX+FW,GH+2*FW);
    fixed(span(-GX-FW,0,-FD/2,-GX-FW+.008,GH+2*FW,FD/2,M.alu)); frame(-GX-FW,0,-GX,GH+2*FW);
    fixed(span(GX+FW-.008,0,-FD/2,GX+FW,GH+2*FW,FD/2,M.alu)); frame(GX,0,GX+FW,GH+2*FW);
    // 玻璃
    const y0=FW*0.5, y1=y0+GH;
    fixed(span(-GX+gap,y0,-GT/2,GX-gap,y1,GT/2,M.glass,{shadow:false}));
    fixed(span(-GX+gap,y0,-GT/2,-GX+gap+.003,y1,GT/2,M.edge,NE)); fixed(span(GX-gap-.003,y0,-GT/2,GX-gap,y1,GT/2,M.edge,NE));
    // 底墊塊（1/4 點）、間隔塊
    [-GX/2,GX/2].forEach(x=> fixed(span(x-.05,.008,-GT/2-.002,x+.05,y0,GT/2+.002,M.block)));
    [[GX-gap,0.6],[GX-gap,1.6],[-GX+gap,0.6],[-GX+gap,1.6]].forEach(([x,y])=> fixed(span(x>0?x:x-gap,y-.03,GT/2,x>0?x+gap:x,y+.03,FD/2-.006,M.spacer)));
    // 底襯材＋矽利康（右側）＋壓條（外側）
    fixed(pipe([GX-gap/2,y0+.05,GT/2+.012],[GX-gap/2,y1-.05,GT/2+.012],.005,M.rod));
    fixed(span(GX-gap-.002,y0,GT/2+.016,GX+.003,y1,FD/2-.006,M.sil));
    fixed(span(-GX-FW,FW*.9,FD/2,GX+FW,FW*1.3,FD/2+.012,M.bead));

    mark(1, 0,1.2,GT,{r:.4, text:'裁切・磨邊後就位', ty:1.75, tw:1.1});
    mark(2, -GX/2,0.02,GT/2+.03,{r:.08, text:'底墊塊（1/4 點）', ty:0.3, tw:1.0});
    mark(2, GX-gap/2,0.6,GT/2+.03,{r:.06});
    add(2, label('間隔塊：四周間隙均勻',GX-0.1,0.85,0.2,1.2),{until:2, drop:0, glow:false});
    mark(3, GX-gap/2,0.7,FD/2,{r:.07, text:'矽利康・填縫條・墊條', ty:0.95, tw:1.3});
    mark(4, GX-gap/2,0.5,GT/2+.012,{r:.05, text:'底襯材：控制膠深、兩面黏', ty:0.72, tw:1.5});
    mark(5, 0.6,FW*1.1,FD/2+.01,{r:.08, text:'壓條・固定框・夾具', ty:0.3, tw:1.2});
    add(6, span(-0.2,1.8,GT/2+.005,0.1,1.85,GT/2+.05,M.clean),{until:6, drop:-.2});
    add(6, arrow([-0.4,2.1,.06],[-0.4,1.4,.06],mat('#16a34a')),{until:6, drop:0, glow:false});
    add(6, label('中性清潔劑・由上而下・不可硬刮',0,2.45,0.2,1.9),{until:6, drop:0, glow:false});
    add(7, group(...[-0.3,0.0,0.3].map(x=> span(x-.08,1.45,GT/2+.001,x+.08,1.5,GT/2+.003,M.sticker,NE))),{until:7, drop:0, glow:false});
    add(7, label('視線高度貼防撞警示',0,1.8,0.2,1.3),{until:7, drop:0, glow:false});
  },
});
</script>
</body>
</html>
