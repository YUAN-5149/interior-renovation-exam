<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>分離式冷暖氣安裝施作程序｜3D 工法動畫</title>
<meta name="description" content="室裝乙級（課本 6-4-11）：分離式冷暖氣安裝施作程序 4 項 3D 互動動畫：銅管配置（高壓管細、低壓管粗）、銲接冷媒銅管、電源線與控制線、排水管洩水坡度。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'施工前', d:'室內機（左側室內牆）與室外機（右側室外）位置已定，要配置兩者之間的管線。牆在穿牆孔處剖切。',
   tip:'依課本 6-4-11「分離式冷暖氣安裝施作程序」共 4 項：銅管配置 → 銲接冷媒銅管 → 電源線與控制線配置 → 排水管配置。室外機、抽真空、室內機另見 6-4-12～14。'},
  {t:'銅管配置', d:'銅管輸送冷媒，分高、低壓管：高壓管孔徑較小，傳送液態冷媒到室內機；低壓管孔徑較大，冷媒吸熱成氣態後，沿低壓管回流到室外機冷卻為液態。', tip:'口訣：高壓細、液態去；低壓粗、氣態回。'},
  {t:'銲接冷媒銅管', d:'銅管從室外機拉到室內機處，中間如需銲接，要用乙炔、氧氣與專用銲條銲接，且技術需熟練。', tip:'銲接不良會漏冷媒；銲接時注意防火。'},
  {t:'電源線與控制線', d:'配置電源線與控制線：電源線供給室內機用電，控制線是遙控開關之用。', tip:'冷氣要用專用迴路並接地。'},
  {t:'排水管配置', d:'室內機的冷凝水要排出；配管方式有明管、埋入暗管與透明軟管，與裝修工程配合施作，並做好洩水坡度，排水順暢。', tip:'排水管不可有往上彎的地方，否則積水、漏水。'},
];

createAnim({
  title: '分離式冷暖氣安裝施作程序',
  steps: STEPS,
  groundY: -0.15,
  minDist: 1.2,
  sun: [5, 8, 4],
  views: {
    def:{dir:[0.8,0.3,0.52],   dist:5.2, target:[0,1.4,-0.3]},
    1:  {dir:[0.85,0.25,0.45], dist:4.6, target:[0.3,1.7,-0.3]},
    2:  {dir:[0.6,0.3,-0.74],  dist:2.6, target:[0.5,1.3,-0.4]},
    4:  {dir:[0.7,0.2,-0.68],  dist:3.6, target:[0.1,1.1,-0.4]},
  },
  note: '管徑與坡度有放大；牆以局部剖切表示。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed}) {
    const T=0.2, HX=0.35, HY=2.05, hr=0.04;
    const IU={x0:-0.6,x1:0.5,y0:2.1,y1:2.4};
    const OU={x0:-0.2,x1:0.7,y0:0.7,y1:1.3,z0:-T-0.65,z1:-T-0.25};
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#eeece7',{roughness:.95}), out: mat('#a8a29e',{roughness:1}),
      indoor: mat('#f8fafc',{roughness:.4}), vent: mat('#cbd5e1'), outdoor: mat('#e5e7eb',{roughness:.5}), fan: mat('#475569'),
      bracket: mat('#374151',{metalness:.5}), pad: mat('#111827'), sleeve: mat('#f8fafc'),
      hi: mat('#b45309',{metalness:.7, roughness:.3}), lo: mat('#d97706',{metalness:.7, roughness:.3}), insul: mat('#f1f5f9',{roughness:.9,transparent:true,opacity:.55,depthWrite:false}),
      liquid: mat('#2563eb',{emissive:'#2563eb', emissiveIntensity:.5}), gas: mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.5}),
      torch: mat('#1f2937'), flame: mat('#38bdf8',{emissive:'#0ea5e9', emissiveIntensity:1}), o2: mat('#16a34a',{metalness:.3}), c2h2: mat('#dc2626',{metalness:.3}),
      power: mat('#111827'), ctrl: mat('#f8fafc'), green: mat('#16a34a'), drain: mat('#94a3b8'), clear: mat('#e0f2fe',{transparent:true, opacity:.7}), drop: mat('#60a5fa',{roughness:.2}),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-1.6,-0.15,-1.6,1.4,0,1.2,M.slab));
    fixed(span(-1.4,0,-T,HX-hr,2.8,0,M.wall));
    fixed(span(HX-hr,0,-T,HX,HY-hr,0,M.wall)); fixed(span(HX-hr,HY+hr,-T,HX,2.8,0,M.wall));
    fixed(span(-1.4,0,-T-.004,HX,2.8,-T,M.out,NE));
    fixed(pipe([HX,HY,0.01],[HX,HY-0.03,-T-.01],.036,M.sleeve));
    fixed(group(span(IU.x0,IU.y0,.01,IU.x1,IU.y1,0.22,M.indoor), span(IU.x0+0.05,IU.y0,.15,IU.x1-0.05,IU.y0+.02,0.21,M.vent,NE)));
    fixed(group(...[OU.x0+0.1,OU.x1-0.1].map(x=>group(span(x-.02,OU.y0-0.35,-T-.04,x+.02,OU.y0,-T,M.bracket), span(x-.02,OU.y0-.04,-T-0.7,x+.02,OU.y0,-T,M.bracket), pipe([x,OU.y0-0.3,-T-.02],[x,OU.y0-.02,-T-0.65],.012,M.bracket)))));
    fixed(group(span(OU.x0,OU.y0+.02,OU.z0,OU.x1,OU.y1,OU.z1,M.outdoor), pipe([OU.x0+0.3,(OU.y0+OU.y1)/2+.01,OU.z0-.002],[OU.x0+0.3,(OU.y0+OU.y1)/2+.01,OU.z0-.004],.22,M.fan)));

    const route=(dy,dx)=>[[HX+dx,HY+dy,0.1],[HX+dx,HY+dy-0.03,-T-.02],[HX+dx,HY+dy-0.06,-T-0.08],[OU.x1-0.05+dx*0.5,OU.y0+0.25+dy,-T-0.08],[OU.x1-0.05+dx*0.5,OU.y0+0.25+dy,OU.z1-0.02]];
    const tube=(pts,r,m)=> new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)),false,'catmullrom',0.1),60,r,8), m.clone());
    /* ① 銅管配置：高壓（細）、低壓（粗） */
    add(1, tube(route(0.014,-0.014),.006,M.hi),{drop:0});
    add(1, tube(route(-0.014,0.014),.011,M.lo),{delay:.3, drop:0});
    add(1, tube(route(0.014,-0.014),.016,M.insul),{delay:.6, drop:0});
    add(1, tube(route(-0.014,0.014),.02,M.insul),{delay:.6, drop:0});
    add(1, arrow([OU.x1+0.15,OU.y0+0.35,-T-0.15],[OU.x1+0.15,HY-0.1,-T-0.15],M.liquid),{until:1, drop:0, glow:false});
    add(1, arrow([HX+0.15,HY,-T-0.3],[OU.x1+0.05,OU.y0+0.5,-T-0.35],M.gas),{until:1, drop:0, glow:false});
    add(1, label('高壓管（細）：液態冷媒 → 室內機',0.5,2.55,-0.2,2.0),{until:1, drop:0, glow:false});
    add(1, label('低壓管（粗）：氣態冷媒 → 回室外機',0.5,1.75,-0.6,2.1),{until:1, drop:0, glow:false});
    /* ② 銲接（乙炔＋氧氣） */
    const W={x:HX+0.2, y:1.5, z:-T-0.08};
    add(2, group(span(W.x-.01,W.y-.05,W.z+.03,W.x+.01,W.y+.05,W.z+.15,M.torch), (()=>{ const c=new THREE.Mesh(new THREE.ConeGeometry(.012,.05,10), M.flame.clone()); c.rotation.x=Math.PI/2; c.position.set(W.x,W.y,W.z+.005); return c; })()),{until:2, drop:0, glow:false});
    add(2, group(pipe([W.x+0.5,0,W.z-0.3],[W.x+0.5,0.9,W.z-0.3],.08,M.o2), pipe([W.x+0.7,0,W.z-0.3],[W.x+0.7,0.9,W.z-0.3],.08,M.c2h2)),{until:2, drop:.2});
    add(2, label('乙炔（紅）・氧氣（綠）・專用銲條',W.x+0.6,1.15,W.z-0.3,2.0),{until:2, drop:0, glow:false});
    add(2, label('技術需熟練',W.x,1.75,W.z,0.9),{until:2, drop:0, glow:false});
    /* ③ 電源線・控制線 */
    add(3, group(pipe([HX+0.03,HY+0.03,0.1],[HX+0.03,HY,-T-.02],.004,M.power), pipe([HX+0.03,HY,-T-.02],[OU.x1,OU.y1-0.1,-T-0.08],.004,M.power), pipe([OU.x1,OU.y1-0.1,-T-0.08],[OU.x1,OU.y1-0.1,OU.z1],.004,M.power),
      pipe([HX+0.04,HY+0.01,0.1],[HX+0.04,HY-0.02,-T-.02],.003,M.ctrl), pipe([HX+0.04,HY-0.02,-T-.02],[OU.x1-0.03,OU.y1-0.13,-T-0.08],.003,M.ctrl), pipe([OU.x1-0.03,OU.y1-0.13,-T-0.08],[OU.x1-0.03,OU.y1-0.13,OU.z1],.003,M.ctrl)),{drop:0, glow:false});
    add(3, label('電源線（黑）：室內機用電・控制線（白）：遙控開關',0.3,2.6,-0.3,2.6),{until:3, drop:0, glow:false});
    /* ④ 排水管（洩水坡度） */
    add(4, tube([[HX-0.02,HY-0.02,0.1],[HX-0.02,HY-0.06,-T-.02],[HX-0.02,HY-0.2,-T-0.06],[HX-0.4,0.3,-T-0.06],[HX-0.45,0.02,-T-0.08]],.01,M.drain),{drop:0});
    for (let i=0;i<5;i++){ const d=new THREE.Mesh(new THREE.SphereGeometry(.013,8,6), M.drop.clone()); d.position.set(HX-0.45,0.25-i*0.05,-T-0.08); add(4, d, {delay:.4+i*.1, drop:0, until:4, glow:false}); }
    add(4, label('明管・暗管・透明軟管｜做好洩水坡度',HX-0.4,1.3,-T-0.2,2.1),{until:4, drop:0, glow:false});
  },
});
</script>
</body>
</html>
