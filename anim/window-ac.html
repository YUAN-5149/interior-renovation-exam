<!DOCTYPE html>

<title>窗型冷暖氣機安裝施作程序｜3D 工法動畫</title>
<meta name="description" content="室裝乙級：窗型冷暖氣機安裝施作程序 10 步驟 3D 互動動畫，含專用迴路、開口補強框、室外支撐架、外低內高排水、縫隙填塞、試運轉。">
<link rel="icon" href="../favicon.ico" sizes="any">

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111908';

const STEPS = [
  {t:'施工前', d:'外牆已預留冷氣開口，要安裝窗型冷暖氣機（左側是室內、右側是室外）。',
   tip:'本動畫依一般安裝實務整理（題庫沒有此題的步驟答案），請對照你的課本確認用詞與順序。'},
  {t:'確認位置與電源', d:'確認安裝位置、開口尺寸，以及專用迴路電源（電壓、插座型式）。', tip:'冷氣要用專用迴路，不可和其他電器共用插座。'},
  {t:'開口補強框', d:'開口四周裝設補強框（木框或角鐵框），確認尺寸與水平。', tip:'補強框讓機體重量傳到牆體，也方便之後填縫收邊。'},
  {t:'室外支撐架', d:'於室外側固定支撐架，以膨脹螺栓鎖固。', tip:'支撐架要能承受機體重量，並注意高處作業安全。'},
  {t:'機體就位・外低內高', d:'將機體推入開口，放在支撐架上，略向室外傾斜。', tip:'外低內高，冷凝水才會往室外流，不會滴進室內。'},
  {t:'固定機體', d:'以固定片或螺絲將機體固定在補強框與支撐架上。', tip:'固定不牢，運轉時會震動、產生噪音。'},
  {t:'縫隙填塞', d:'機體與開口之間的縫隙以泡棉、填縫材填塞。', tip:'填塞可以防水、隔音、防止蚊蟲進入。'},
  {t:'室外防水', d:'室外側上緣打矽利康、加裝遮雨板。', tip:'雨水最容易從機體上方的縫隙滲入。'},
  {t:'室內收邊', d:'室內側以收邊框收邊。', tip:'收邊框蓋住填縫材，外觀整齊。'},
  {t:'排水處理', d:'確認冷凝水排水方向，必要時接排水管引導到排水處。', tip:'排水不可直接滴到樓下或人行道上。'},
  {t:'接電試運轉', d:'接上專用迴路電源、確認接地，試運轉：冷、暖、排水、噪音與震動。', tip:'試運轉時量出風口溫度，確認冷暖功能正常。'},
];

createAnim({
  title: '窗型冷暖氣機安裝施作程序',
  steps: STEPS,
  groundY: -0.15,
  minDist: 1.2,
  sun: [5, 8, 4],
  views: {
    def:{dir:[0.75,0.25,0.62],  dist:4.4, target:[0,1.4,0]},
    3:  {dir:[0.55,0.15,-0.82], dist:3.6, target:[0,1.2,-0.3]},
    4:  {dir:[0.98,0.1,0.15],   dist:3.0, target:[0,1.4,-0.1]},
    7:  {dir:[0.55,0.2,-0.81],  dist:3.0, target:[0,1.45,-0.3]},
    9:  {dir:[0.6,0.15,-0.78],  dist:3.4, target:[0,1.2,-0.4]},
  },
  note: '機體尺寸與傾斜角度有放大。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed}) {
    const T=0.2, OX=0.33, OY0=1.2, OY1=1.65;
    const M = {
      slab: mat('#d3cec8',{roughness:1}), wall: mat('#c9c4bb',{roughness:1}), out: mat('#a8a29e',{roughness:1}),
      frame: mat('#6b7280',{metalness:.5, roughness:.4}), bracket: mat('#374151',{metalness:.5}), bolt: mat('#f97316'),
      unit: mat('#e5e7eb',{roughness:.5}), grille: mat('#cbd5e1',{roughness:.4}), back: mat('#9ca3af',{metalness:.3}),
      foam: mat('#facc15',{roughness:1}), sil: mat('#f8fafc'), hood: mat('#78716c',{metalness:.3}), trim: mat('#fafaf9'),
      drain: mat('#94a3b8'), drop: mat('#60a5fa',{roughness:.2}), plug: mat('#f8fafc'), green: mat('#16a34a'), cold: mat('#38bdf8',{transparent:true, opacity:.5, depthWrite:false}),
      laser: mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.8}), level: mat('#facc15'),
    };
    const NE={edges:false, shadow:false};
    fixed(span(-1.4,-0.15,-1.4,1.4,0,1.2,M.slab));
    // 牆（中間開口）；室內面 z=0、室外面 z=-T
    fixed(span(-1.2,0,-T,-OX,2.6,0,M.wall)); fixed(span(OX,0,-T,1.2,2.6,0,M.wall));
    fixed(span(-OX,0,-T,OX,OY0,0,M.wall)); fixed(span(-OX,OY1,-T,OX,2.6,0,M.wall));
    fixed(span(-1.2,0,-T-.004,1.2,2.6,-T,M.out,NE));
    fixed(span(0.6,0.3,0,0.68,0.42,.01,M.plug));

    /* ① 位置與電源 */
    add(1, group(span(-OX,OY0-.004,.001,OX,OY0+.004,.004,M.laser,NE), span(-OX,OY1-.004,.001,OX,OY1+.004,.004,M.laser,NE)),{until:2, drop:0, glow:false});
    add(1, label('開口尺寸・專用迴路電源',0,2.1,0.3,1.6),{until:1, drop:0, glow:false});
    /* ② 補強框 */
    const fr=.035;
    add(2, group(span(-OX,OY0,-T,OX,OY0+fr,0,M.frame), span(-OX,OY1-fr,-T,OX,OY1,0,M.frame), span(-OX,OY0,-T,-OX+fr,OY1,0,M.frame), span(OX-fr,OY0,-T,OX,OY1,0,M.frame)),{drop:.2});
    add(2, span(-0.2,OY0+fr,-0.1,0.2,OY0+fr+.04,-0.06,M.level),{until:2, drop:-.1});
    /* ③ 室外支撐架 */
    add(3, group(...[-0.25,0.25].map(x=>group(span(x-.02,OY0-0.5,-T-.04,x+.02,OY0,-T,M.bracket), span(x-.02,OY0-.04,-T-0.55,x+.02,OY0,-T,M.bracket), pipe([x,OY0-0.45,-T-.02],[x,OY0-.02,-T-0.5],.012,M.bracket))),
      ...[-0.25,0.25].flatMap(x=>[OY0-0.4,OY0-0.1].map(y=>pipe([x,y,-T-.04],[x,y,-T-.06],.012,M.bolt)))),{drop:.2});
    add(3, label('支撐架膨脹螺栓固定',0,OY0-0.75,-T-0.3,1.3),{until:3, drop:0, glow:false});
    /* ④ 機體（外低內高） */
    const unit=group(span(-OX+fr+.01,OY0+fr+.01,-0.55,OX-fr-.01,OY1-fr-.01,0.12,M.unit), span(-OX+fr+.03,OY0+fr+.05,0.12,OX-fr-.03,OY1-fr-.03,0.125,M.grille,NE), span(-OX+fr+.03,OY0+fr+.03,-0.555,OX-fr-.03,OY1-fr-.03,-0.55,M.back,NE));
    unit.rotation.x=-0.06;
    add(4, unit, {drop:0});
    add(4, group(arrow([0.45,OY1+0.25,0.2],[0.45,OY1+0.15,-0.6],M.laser)),{until:4, drop:0, glow:false});
    add(4, label('外低內高（排水往室外）',0,2.15,-0.2,1.5),{until:4, drop:0, glow:false});
    /* ⑤ 固定 */
    add(5, group(...[[-OX+fr,OY0+0.1],[OX-fr,OY0+0.1],[-OX+fr,OY1-0.1],[OX-fr,OY1-0.1]].map(([x,y])=>span(x-.01,y-.03,0.02,x+.01,y+.03,0.06,M.bolt))),{drop:0, glow:false});
    add(5, label('固定片鎖固',0,2.1,0.3,0.9),{until:5, drop:0, glow:false});
    /* ⑥ 填縫 */
    add(6, group(span(-OX+fr,OY1-fr-.012,-T+.02,OX-fr,OY1-fr,-.01,M.foam), span(-OX+fr,OY0+fr,-T+.02,-OX+fr+.012,OY1-fr,-.01,M.foam), span(OX-fr-.012,OY0+fr,-T+.02,OX-fr,OY1-fr,-.01,M.foam)),{drop:0});
    add(6, label('縫隙填塞：防水・隔音・防蟲',0,2.1,0.3,1.8),{until:6, drop:0, glow:false});
    /* ⑦ 室外防水：矽利康＋遮雨板 */
    add(7, group(span(-OX-.01,OY1-.005,-T-.012,OX+.01,OY1+.008,-T,M.sil), span(-OX-0.08,OY1+.02,-T-0.25,OX+0.08,OY1+.035,-T,M.hood)),{drop:.15});
    add(7, label('上緣矽利康＋遮雨板',0,OY1+0.4,-T-0.3,1.3),{until:7, drop:0, glow:false});
    /* ⑧ 室內收邊 */
    add(8, group(span(-OX-.04,OY0-.04,0,OX+.04,OY0+fr,.015,M.trim), span(-OX-.04,OY1-fr,0,OX+.04,OY1+.04,.015,M.trim), span(-OX-.04,OY0,0,-OX+fr,OY1,.015,M.trim), span(OX-fr,OY0,0,OX+.04,OY1,.015,M.trim)),{drop:.1});
    /* ⑨ 排水 */
    add(9, pipe([0.2,OY0+0.02,-0.56],[0.2,0.05,-0.75],.012,M.drain),{drop:0});
    for (let i=0;i<6;i++){ const d=new THREE.Mesh(new THREE.SphereGeometry(.015,8,6), M.drop.clone()); d.position.set(0.2,OY0-0.2-i*0.15,-0.6-i*0.025); add(9, d, {delay:.3+i*.1, drop:0, until:9, glow:false}); }
    add(9, label('冷凝水引到排水處',0.2,OY0-0.4,-0.9,1.2),{until:9, drop:0, glow:false});
    /* ⑩ 接電・試運轉 */
    add(10, group(pipe([OX-0.05,OY0+0.05,0.12],[0.64,0.42,0.02],.005,M.plug), pipe([0.64,0.38,0.012],[0.64,0.3,0.05],.004,M.green)),{drop:0, glow:false});
    add(10, span(-0.25,OY0+0.1,0.13,0.25,OY1-0.08,0.5,M.cold,NE),{delay:.4, drop:0, glow:false});
    add(10, label('專用迴路・接地・試運轉冷暖排水',0,2.15,0.3,2.0),{until:10, drop:0, glow:false});
  },
});
</script>
</body>
</html>
