<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>防火金屬門框施工要點｜3D 工法動畫</title>
<meta name="description" content="室裝乙級術科：裝修防火金屬門框施工應注意事項 8 項，以 3D 互動動畫依施工順序呈現。">
<link rel="icon" href="../favicon.ico" sizes="any">
<meta name="theme-color" content="#292524">
<link rel="stylesheet" href="anim.css?v=2026111801">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import { createAnim, THREE } from './engine.js?v=2026111805';

const STEPS = [
  {t:'施工前', d:'防火區劃的牆上留有門洞，要安裝防火金屬門框與門扇。',
   tip:'術科考過「裝修防火金屬門框施工時應注意事項」。這裡把 8 個注意事項照施工順序排出來，方便記憶。'},
  {t:'確認認證・整組使用', d:'使用經認可的防火門（具防火標章、測試報告），門框與門扇須整組，不得混用。',
   tip:'防火時效是「整組」測試出來的，門框與門扇混搭就不保證有防火時效。'},
  {t:'錨定固定・校正', d:'門框以錨定件與牆體確實固定，並校正垂直與水平。',
   tip:'門框不垂直，門扇會關不緊，煙和火就從縫隙竄過去。'},
  {t:'灌漿・防火填縫', d:'門框內灌填水泥砂漿，門框與牆體間隙以防火材料填實。',
   tip:'門框內中空若不灌漿，受熱會變形；牆體間隙要用防火材料，不能只用一般發泡劑。'},
  {t:'門扇間隙', d:'吊上門扇，門扇與門框的間隙須符合規定。',
   tip:'間隙太大會漏煙，太小則開關不順。'},
  {t:'自動關閉裝置', d:'裝設門弓器（自動關閉裝置），常時關閉，或與偵煙器連動。',
   tip:'防火門平時要關著；需要常開的，要用與偵煙器連動的裝置，火災時自動關閉。'},
  {t:'不得加裝門止', d:'不得加裝門止或其他妨礙關閉的物品。',
   tip:'門止會讓防火門一直開著，火災時就失去阻隔作用。'},
  {t:'防火五金', d:'鉸鍊、把手、鎖等五金須為防火認證品。',
   tip:'一般五金在高溫下會軟化、熔化，門扇就可能脫落或打開。'},
  {t:'標示', d:'依規定標示防火門，例如「常時關閉式防火門」。',
   tip:'標示提醒使用者不要把防火門卡住開著。'},
];

createAnim({
  title: '防火金屬門框施工要點',
  steps: STEPS,
  groundY: -0.15,
  sun: [3, 8, 6],
  views: {
    def:{dir:[0.45,0.2,0.87], dist:5.0, target:[0,1.1,0]},
    1:  {dir:[0.35,0.65,0.68], dist:3.8, target:[0,0.3,0.95]},
    3:  {dir:[0.6,0.5,0.62],  dist:2.8, target:[0.45,1.9,0]},
    5:  {dir:[0.4,0.3,0.87],  dist:3.0, target:[0,1.9,0]},
    6:  {dir:[0.5,0.45,0.74], dist:3.2, target:[0.3,0.4,0.4]},
  },
  note: '各構件比例為示意；實際應依認可的防火門構造施工。',
  build({THREE, mat, box, span, pipe, group, arrow, label, add, fixed}) {
    const OX=0.53, OH=2.13, T=0.2;            // 門洞半寬、高、牆厚
    const FX=0.5, FH=2.1, FW=0.05;            // 門框外緣、框寬
    const M = {
      slab:  mat('#d3cec8',{roughness:1}),
      wall:  mat('#c9c4bb',{roughness:1}),
      frame: mat('#6b7280',{metalness:.4, roughness:.45}),
      leaf:  mat('#94a3b8',{metalness:.3, roughness:.5}),
      anchor:mat('#f97316',{roughness:.5}),
      laser: mat('#ef4444',{emissive:'#ef4444', emissiveIntensity:.8}),
      grout: mat('#a8a29e',{roughness:1}),
      fire:  mat('#ef4444',{roughness:.8}),
      gap:   mat('#facc15',{emissive:'#facc15', emissiveIntensity:.5}),
      closer:mat('#1f2937',{metalness:.3, roughness:.4}),
      stop:  mat('#a16207',{roughness:.8}),
      no:    mat('#dc2626',{emissive:'#dc2626', emissiveIntensity:.5}),
      metal: mat('#e5e7eb',{metalness:.7, roughness:.25}),
      badge: mat('#16a34a',{emissive:'#16a34a', emissiveIntensity:.4}),
    };
    const NE={edges:false, shadow:false};

    fixed(span(-2,-0.15,-0.8, 2,0,1.6, M.slab));
    fixed(span(-1.8,0,-T, -OX,2.7,0, M.wall));
    fixed(span(OX,0,-T, 1.8,2.7,0, M.wall));
    fixed(span(-OX,OH,-T, OX,2.7,0, M.wall));

    // 門框（擋門片在中間）與門扇的形狀
    const frameShape = (m)=> group(
      span(-FX,0,-T-.01,-FX+FW,FH,.01,m), span(FX-FW,0,-T-.01,FX,FH,.01,m), span(-FX,FH-FW,-T-.01,FX,FH,.01,m),
      span(-FX+FW,0,-0.12,-FX+FW+.015,FH-FW,-0.08,m), span(FX-FW-.015,0,-0.12,FX-FW,FH-FW,-0.08,m), span(-FX+FW,FH-FW-.015,-0.12,FX-FW,FH-FW,-0.08,m));
    const LX0=-FX+FW+.004, LX1=FX-FW-.004, LY0=.008, LY1=FH-FW-.004;   // 門扇（留間隙）

    /* ① 認證・整組：門框與門扇放在地上，貼防火標章 */
    { const f=frameShape(M.frame); f.rotation.x=-Math.PI/2; f.position.set(-0.9,.02,1.25); f.scale.setScalar(.45);
      add(1, f, {delay:0, drop:.3, until:1});
      add(1, span(0.4,0,0.6,1.2,0.04,1.3,M.leaf),{delay:.2, drop:.3, until:1});
      add(1, span(0.7,0.04,0.85,0.9,0.045,0.95,M.badge,NE),{delay:.5, drop:0, until:1, glow:false});
      add(1, label('防火標章・門框門扇整組',0,0.75,1.0,1.4),{delay:.6, drop:0, until:1, glow:false}); }

    /* ② 錨定固定＋校正垂直水平 */
    add(2, frameShape(M.frame),{delay:0, drop:.4});
    [0.3,1.0,1.7].forEach((y,i)=>{ [-1,1].forEach(s=>
      add(2, span(s>0?FX:-OX,y-.03,-0.14,s>0?OX:-FX,y+.03,-0.06,M.anchor),{delay:.5+i*.1, drop:0})); });
    add(2, span(-0.003,0,.012,0.003,FH,.016,M.laser,NE),{delay:.9, drop:0, until:2, glow:false});
    add(2, span(-FX,1.0-.003,.012,FX,1.0+.003,.016,M.laser,NE),{delay:1.0, drop:0, until:2, glow:false});

    /* ③ 門框內灌漿＋與牆體間隙防火材料 */
    add(3, group(span(-OX,0,-T+.01,-FX,OH,-.01,M.fire,NE), span(FX,0,-T+.01,OX,OH,-.01,M.fire,NE), span(-OX,FH,-T+.01,OX,OH,-.01,M.fire,NE)),{delay:0, drop:0});
    add(3, span(-FX+.005,FH-FW+.005,-T,FX-.005,FH-.005,0.005,M.grout,NE),{delay:.4, drop:0, until:3});
    add(3, label('框內灌漿・間隙防火填實',0.45,2.38,0.2,0.9),{delay:.5, drop:0, until:3, glow:false});

    /* ④ 吊門扇＋間隙示意 */
    add(4, span(LX0,LY0,-0.08,LX1,LY1,-0.035,M.leaf),{delay:0, drop:.3, until:7});
    add(4, group(span(LX0,LY1,-.03,LX1,LY1+.004,-.028,M.gap,NE), span(LX1,LY0,-.03,LX1+.004,LY1,-.028,M.gap,NE), span(LX0,0,-.03,LX1,LY0,-.028,M.gap,NE)),{delay:.5, drop:0, until:4, glow:false});
    add(4, label('門扇間隙符合規定',0,2.45,0.3,1.2),{delay:.6, drop:0, until:4, glow:false});

    /* ⑤ 門弓器（自動關閉） */
    add(5, group(span(-0.3,FH-FW-.09,-.03,0.05,FH-FW-.03,.03,M.closer), span(0.0,FH-FW-.02,-.02,0.3,FH-FW-.005,.005,M.closer)),{delay:0, drop:.2});
    add(5, label('門弓器・常時關閉',0,2.45,0.3,1.2),{delay:.4, drop:0, until:5, glow:false});

    /* ⑥ 不得加裝門止 */
    { const st=group(span(0.25,0,0.5,0.4,0.05,0.6,M.stop));
      add(6, st, {delay:0, drop:.2, until:6});
      const a=box(.4,.03,.02,M.no,NE); a.position.set(0.32,0.25,0.55); a.rotation.z=.75;
      const b=box(.4,.03,.02,M.no,NE); b.position.set(0.32,0.25,0.55); b.rotation.z=-.75;
      add(6, group(a,b), {delay:.4, drop:0, until:6, glow:false});
      add(6, label('不得加裝門止',0.32,0.65,0.55,1.0),{delay:.6, drop:0, until:6, glow:false}); }

    /* ⑦ 防火五金：鉸鍊、把手、鎖 */
    [0.25,1.05,1.8].forEach((y,i)=> add(7, pipe([LX0-.006,y-.06,-0.03],[LX0-.006,y+.06,-0.03],.012,M.metal),{delay:i*.15, drop:0}));
    add(7, group(span(LX1-.12,0.95,-.035,LX1-.08,1.1,-.025,M.metal), span(LX1-.25,1.02,-.025,LX1-.08,1.04,0.01,M.metal)),{delay:.5, drop:.1});
    add(7, label('防火認證五金',0,2.45,0.3,1.0),{delay:.6, drop:0, until:7, glow:false});

    /* ⑧ 標示 */
    { const c=document.createElement('canvas'); c.width=512; c.height=128; const g=c.getContext('2d');
      g.fillStyle='#ffffff'; g.fillRect(0,0,512,128); g.strokeStyle='#dc2626'; g.lineWidth=10; g.strokeRect(5,5,502,118);
      g.fillStyle='#dc2626'; g.font='bold 52px "Noto Sans TC","Microsoft JhengHei",sans-serif'; g.textAlign='center'; g.textBaseline='middle';
      g.fillText('常時關閉式防火門',256,66);
      const tex=new THREE.CanvasTexture(c); tex.colorSpace=THREE.SRGBColorSpace;
      const sign=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.15), new THREE.MeshStandardMaterial({map:tex, roughness:.5}));
      sign.position.set(0,1.55,-0.033);
      add(8, group(span(LX0,LY0,-0.08,LX1,LY1,-0.035,M.leaf), sign), {delay:0, drop:0}); }
  },
});
</script>
</body>
</html>
